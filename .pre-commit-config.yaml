# Local hooks mirror CI: `pre-commit install` once, then commits run ruff (same
# pinned version as requirements-dev.txt) and the generic file checks; pushes run
# the type check. bandit and the full test suite stay in CI and `make check`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        args: [--force-exclude]

  - repo: local
    hooks:
      - id: typecheck
        name: mypy (make typecheck)
        entry: make typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]
