# Keeps the SHA-pinned GitHub Actions and digest-pinned images current.
# Dependabot updates both the SHA and the trailing "# vX.Y.Z" comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    commit-message:
      prefix: docker

  - package-ecosystem: docker
    directory: /src/lg_front
    schedule:
      interval: weekly
    commit-message:
      prefix: docker

  - package-ecosystem: npm
    directory: /src/lg_front
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-dev:
        dependency-type: development
    commit-message:
      prefix: deps

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # langsmith (required by langchain-core) pins uuid-utils<1.0, so 1.x cannot
      # resolve. Drop this once langsmith allows it.
      - dependency-name: uuid-utils
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
