name: Release images

# Publishes the backend and frontend images to GHCR and hands them to the
# Deploy workflow (docs/cicd.md):
#
# * CI succeeded for a push to main -> build once for linux/amd64 and
#   linux/arm64 (Oracle Ampere VMs), push ghcr.io/gapilongo/lg-sotf[-frontend]
#   as sha-<7 hex> and main, sign both digests with cosign (keyless, GitHub
#   OIDC) and attest their build provenance, then deploy that digest to the
#   `dev` environment. deploy.yml refuses a digest whose signature or
#   provenance does not verify (docs/security.md, section 9).
# * A release tag vX.Y.Z is pushed -> nothing is rebuilt: the sha-<7 hex>
#   manifests of the tagged commit (which went through main CI) are re-tagged
#   vX.Y.Z and that same digest is deployed to the `uat` environment. The
#   release also gets its SBOMs (Python, npm, both images per platform) and
#   the OpenVEX document as assets, each with a build-provenance attestation
#   (docs/security.md, section 9).
# * Release train (release-train.yml) starts this workflow on a tag it has
#   just created (vX.Y.Z-rc.N or vX.Y.Z): a tag created with GITHUB_TOKEN
#   starts no workflow by itself. That run takes the tag path above.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]
  # Run on a tag ref only (Release train); on a branch no job's condition matches.
  workflow_dispatch:

# Jobs opt in to what they need; packages: write only where images are pushed.
permissions:
  contents: read

concurrency:
  group: release-images-${{ github.event_name != 'workflow_run' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  APP_REPO: ghcr.io/gapilongo/lg-sotf
  FRONTEND_REPO: ghcr.io/gapilongo/lg-sotf-frontend
  PLATFORMS: linux/amd64,linux/arm64
  # The Trivy release that writes the image SBOMs; the same one as ci.yml's CVE gate.
  TRIVY_VERSION: v0.76.1

jobs:
  build:
    name: Build and push (amd64 + arm64)
    # Only a green CI run of a push to main of this repository (not forks, not
    # pull requests, not the weekly scheduled scan).
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.repository == 'gapilongo/SOC'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
      app_digest: ${{ steps.app.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Image metadata
        id: meta
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "unexpected head sha" >&2; exit 1; }
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/lg_sotf/__init__.py)"
          {
            echo "commit=$HEAD_SHA"
            echo "tag=sha-${HEAD_SHA:0:7}"
            echo "version=${version:-0.0.0}+sha.${HEAD_SHA:0:7}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.APP_REPO }}:${{ steps.meta.outputs.tag }}
            ${{ env.APP_REPO }}:main
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.meta.outputs.commit }}
            CREATED=${{ steps.meta.outputs.created }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend image
        id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/lg_front
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.FRONTEND_REPO }}:${{ steps.meta.outputs.tag }}
            ${{ env.FRONTEND_REPO }}:main
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.meta.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Summary
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          {
            echo "### Images published ($TAG)"
            echo ""
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| \`$APP_REPO:$TAG\` | \`$APP_DIGEST\` |"
            echo "| \`$FRONTEND_REPO:$TAG\` | \`$FRONTEND_DIGEST\` |"
            echo ""
            echo "Platforms: $PLATFORMS. Also tagged \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"

  sign:
    name: Sign images and attest provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job of any release path that can mint a GitHub OIDC token. It
    # checks out and runs no repository code (no build steps, no scripts from
    # the tree): only pinned actions and cosign, on the digests the build job
    # pushed. A compromised build step therefore never holds signing material
    # (SLSA Build L3: provenance the build cannot forge). Signatures and
    # attestations are keyed to the image digest, so the vX.Y.Z tag that
    # `promote` later points at the same digest is covered without re-signing.
    permissions:
      contents: read
      packages: write # store signatures and attestations next to the images
      id-token: write # OIDC token -> short-lived Sigstore (Fulcio) certificate
      attestations: write # record the provenance in the repository's attestations
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.0.6
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign the image digests (keyless)
        env:
          APP_DIGEST: ${{ needs.build.outputs.app_digest }}
          FRONTEND_DIGEST: ${{ needs.build.outputs.frontend_digest }}
        run: |
          for d in "$APP_DIGEST" "$FRONTEND_DIGEST"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected digest '$d'"; exit 1; }
          done
          # By digest, never by tag: a tag can be moved after signing.
          cosign sign --yes "$APP_REPO@$APP_DIGEST"
          cosign sign --yes "$FRONTEND_REPO@$FRONTEND_DIGEST"
      - name: Backend build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.APP_REPO }}
          subject-digest: ${{ needs.build.outputs.app_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Frontend build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.FRONTEND_REPO }}
          subject-digest: ${{ needs.build.outputs.frontend_digest }}
          push-to-registry: true
          create-storage-record: false

  deploy-dev:
    name: Deploy dev
    # Never before the digests are signed: deploy.yml verifies them.
    needs: [build, sign]
    # Off until the dev VM exists: set the repository variable AUTO_DEPLOY_DEV=true
    # (Settings > Secrets and variables > Actions > Variables). docs/cicd.md.
    if: vars.AUTO_DEPLOY_DEV == 'true'
    permissions:
      contents: read
      packages: read
      attestations: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      image_tag: ${{ needs.build.outputs.image_tag }}
      commit: ${{ needs.build.outputs.commit }}
      app_digest: ${{ needs.build.outputs.app_digest }}
      frontend_digest: ${{ needs.build.outputs.frontend_digest }}
    secrets: inherit

  promote:
    name: Promote sha image to release tag
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/v') && github.repository == 'gapilongo/SOC'
    runs-on: ubuntu-latest
    # Waits (up to about 45 minutes) for the tagged commit's main build when the
    # tag was pushed right after the merge.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.check.outputs.tag }}
      commit: ${{ steps.check.outputs.commit }}
      app_digest: ${{ steps.retag.outputs.app_digest }}
      frontend_digest: ${{ steps.retag.outputs.frontend_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] \
            || { echo "::error::release tags look like v1.2.3 or v1.2.3-rc.1 (got $TAG)"; exit 1; }
          commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          # Only commits that are on main have been through CI and have images.
          git merge-base --is-ancestor "$commit" origin/main \
            || { echo "::error::$TAG ($commit) is not on main; tag a commit that main CI built"; exit 1; }
          { echo "tag=$TAG"; echo "commit=$commit"; echo "sha_tag=sha-${commit:0:7}"; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag the existing manifests (no rebuild)
        id: retag
        env:
          TAG: ${{ steps.check.outputs.tag }}
          SHA_TAG: ${{ steps.check.outputs.sha_tag }}
        run: |
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty'
          }
          for _ in $(seq 1 90); do
            app="$(digest_of "$APP_REPO:$SHA_TAG" || true)"
            fe="$(digest_of "$FRONTEND_REPO:$SHA_TAG" || true)"
            [ -n "$app" ] && [ -n "$fe" ] && break
            echo "waiting for $SHA_TAG images (main build still running?)"
            sleep 30
          done
          [ -n "$app" ] && [ -n "$fe" ] || { echo "::error::no $SHA_TAG images; did Release images succeed for this commit?"; exit 1; }
          docker buildx imagetools create --tag "$APP_REPO:$TAG" "$APP_REPO@$app"
          docker buildx imagetools create --tag "$FRONTEND_REPO:$TAG" "$FRONTEND_REPO@$fe"
          # The tag must now resolve to exactly the digest main built.
          [ "$(digest_of "$APP_REPO:$TAG")" = "$app" ] && [ "$(digest_of "$FRONTEND_REPO:$TAG")" = "$fe" ] \
            || { echo "::error::re-tagged digest differs"; exit 1; }
          { echo "app_digest=$app"; echo "frontend_digest=$fe"; } >> "$GITHUB_OUTPUT"
          {
            echo "### Promoted $SHA_TAG to $TAG"
            echo ""
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| \`$APP_REPO:$TAG\` | \`$app\` |"
            echo "| \`$FRONTEND_REPO:$TAG\` | \`$fe\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  release-assets:
    name: Build release SBOMs and VEX
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.promote.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install SBOM tooling
        run: pip install --require-hashes -r scripts/ci/requirements-tools.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: SBOMs (Python, npm, each image and platform) and VEX, validated
        env:
          TAG: ${{ needs.promote.outputs.image_tag }}
          APP_DIGEST: ${{ needs.promote.outputs.app_digest }}
          FRONTEND_DIGEST: ${{ needs.promote.outputs.frontend_digest }}
        run: |
          for d in "$APP_DIGEST" "$FRONTEND_DIGEST"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected digest '$d'"; exit 1; }
          done
          # The SBOMs describe exactly the digests the tag points at.
          PLATFORMS="${PLATFORMS//,/ }" scripts/ci/release_assets.sh release-assets "$TAG" \
            "lg-sotf=$APP_REPO@$APP_DIGEST" "lg-sotf-frontend=$FRONTEND_REPO@$FRONTEND_DIGEST"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  attest-release-assets:
    name: Attest release SBOMs and VEX
    needs: release-assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Like `sign`: no checkout, no repository code, only pinned actions on the files the
    # release-assets job produced. Customers verify the files with `gh attestation verify`.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Build provenance for every asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*.json

  publish-release-assets:
    name: Attach SBOMs and VEX to the GitHub release
    needs: [promote, attest-release-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release if needed, upload its assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Upload to the release (created from the tag if it does not exist yet)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.promote.outputs.image_tag }}
        run: |
          pre=(); [[ "$TAG" == *-rc.* ]] && pre=(--prerelease)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes "${pre[@]}"
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

  deploy-uat:
    name: Deploy uat
    needs: promote
    # Off until the uat VM exists: set the repository variable AUTO_DEPLOY_UAT=true.
    if: vars.AUTO_DEPLOY_UAT == 'true'
    permissions:
      contents: read
      packages: read
      attestations: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: uat
      image_tag: ${{ needs.promote.outputs.image_tag }}
      commit: ${{ needs.promote.outputs.commit }}
      app_digest: ${{ needs.promote.outputs.app_digest }}
      frontend_digest: ${{ needs.promote.outputs.frontend_digest }}
    secrets: inherit
