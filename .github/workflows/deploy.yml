name: Deploy

# Deploys published images to an environment's host over SSH (docs/cicd.md;
# a self-hosted PC behind Tailscale Funnel: docs/self-hosting-pc.md).
#
# * Called by "Release images": dev after every green main build, uat after a
#   vX.Y.Z tag has been promoted (same digest, never rebuilt).
# * Run by hand (Actions > Deploy > Run workflow) to redeploy or roll back:
#   pick the environment and an existing image tag (sha-<7 hex>, main or
#   vX.Y.Z).
#
# Before anything reaches the host, both image digests must carry a cosign
# signature and a SLSA build-provenance attestation made by this repository's
# "Release images" workflow on main (exact certificate identity and OIDC
# issuer). Anything else, including an image published before signing
# existed, stops the deploy (fail closed; docs/security.md, section 9).
#
# The deploy bundle (compose files, Caddy templates, deploy/backup scripts) is
# taken from the exact commit the images were built from, copied to the VM and
# run there as the non-root deploy user. Secrets travel only on the SSH
# session's stdin and are written on the host to a 0600 env file; they are
# never put on a command line or printed.
#
# Per-environment variables choose the ingress (INGRESS: caddy, the default,
# or funnel) and whether the runner first joins the owner's tailnet as an
# ephemeral tag:ci node to reach an SSH server that listens only on the
# host's tailnet address (DEPLOY_VIA_TAILSCALE=true, with the
# TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET secrets).

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image_tag:
        type: string
        required: true
      commit:
        type: string
        required: false
        default: ""
      app_digest:
        type: string
        required: false
        default: ""
      frontend_digest:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options: [dev, uat]
        required: true
      image_tag:
        description: "Image tag to deploy: sha-<7 hex>, main or vX.Y.Z (the previous one rolls back)"
        type: string
        required: true

permissions:
  contents: read

env:
  APP_REPO: ghcr.io/gapilongo/lg-sotf
  FRONTEND_REPO: ghcr.io/gapilongo/lg-sotf-frontend
  REMOTE_ROOT: /opt/lg-sotf
  # Who may sign a deployable image: the release workflow, run from main.
  SIGNER_REPO: gapilongo/SOC
  SIGNER_IDENTITY: https://github.com/gapilongo/SOC/.github/workflows/release-images.yml@refs/heads/main
  SIGNER_OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ vars.APP_DOMAIN }}
    # One deploy per environment at a time; a queued one waits (never cancels
    # a deploy half way through).
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TARGET_ENV: ${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      INPUT_COMMIT: ${{ inputs.commit }}
      INPUT_APP_DIGEST: ${{ inputs.app_digest }}
      INPUT_FRONTEND_DIGEST: ${{ inputs.frontend_digest }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      INGRESS: ${{ vars.INGRESS || 'caddy' }}
      DEPLOY_VIA_TAILSCALE: ${{ vars.DEPLOY_VIA_TAILSCALE || 'false' }}
    steps:
      - name: Validate inputs and settings
        env:
          HAS_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAS_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS != '' }}
          HAS_TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
          HAS_TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET != '' }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          [[ "$TARGET_ENV" =~ ^(dev|uat)$ ]] || fail "environment must be dev or uat"
          [[ "$IMAGE_TAG" =~ ^(main|sha-[0-9a-f]{7,40}|v[0-9]+\.[0-9]+\.[0-9]+)$ ]] \
            || fail "image_tag must be sha-<hex>, main or vX.Y.Z"
          [ -z "$INPUT_COMMIT" ] || [[ "$INPUT_COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail "bad commit input"
          for d in "$INPUT_APP_DIGEST" "$INPUT_FRONTEND_DIGEST"; do
            [ -z "$d" ] || [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "bad digest input"
          done
          [[ "$APP_DOMAIN" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$ ]] \
            || fail "set the APP_DOMAIN variable of the $TARGET_ENV environment (e.g. soc-dev.duckdns.org)"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.:-]+$ ]] \
            || fail "set the DEPLOY_HOST variable of the $TARGET_ENV environment (VM public IP or DNS name)"
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || fail "bad DEPLOY_USER"
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || fail "bad DEPLOY_PORT"
          [ "$HAS_SSH_KEY" = "true" ] || fail "missing secret DEPLOY_SSH_KEY in environment $TARGET_ENV"
          [ "$HAS_KNOWN_HOSTS" = "true" ] || fail "missing secret DEPLOY_SSH_KNOWN_HOSTS in environment $TARGET_ENV"
          [[ "$INGRESS" =~ ^(caddy|funnel)$ ]] || fail "the INGRESS variable must be caddy or funnel"
          if [ "$INGRESS" = "funnel" ]; then
            [[ "${APP_DOMAIN,,}" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.[a-z0-9]([a-z0-9-]*[a-z0-9])?\.ts\.net$ ]] \
              || fail "with INGRESS=funnel, APP_DOMAIN must be <machine name>.<tailnet>.ts.net (e.g. soc-dev.tail1234.ts.net)"
          elif [[ "${APP_DOMAIN,,}" =~ (^|\.)ts\.net$ ]]; then
            fail "APP_DOMAIN $APP_DOMAIN is a Tailscale name: *.ts.net names are served only by INGRESS=funnel (set the INGRESS variable of the $TARGET_ENV environment to funnel)"
          fi
          [[ "$DEPLOY_VIA_TAILSCALE" =~ ^(true|false)$ ]] || fail "the DEPLOY_VIA_TAILSCALE variable must be true or false"
          if [ "$DEPLOY_VIA_TAILSCALE" = "true" ]; then
            [ "$HAS_TS_OAUTH_CLIENT_ID" = "true" ] || fail "DEPLOY_VIA_TAILSCALE=true needs the secret TS_OAUTH_CLIENT_ID in environment $TARGET_ENV"
            [ "$HAS_TS_OAUTH_SECRET" = "true" ] || fail "DEPLOY_VIA_TAILSCALE=true needs the secret TS_OAUTH_SECRET in environment $TARGET_ENV"
          fi

      - name: Check application secrets are present
        env:
          POSTGRES_SUPERUSER_PASSWORD: ${{ secrets.POSTGRES_SUPERUSER_PASSWORD }}
          LGSOTF_OWNER_PASSWORD: ${{ secrets.LGSOTF_OWNER_PASSWORD }}
          LGSOTF_APP_PASSWORD: ${{ secrets.LGSOTF_APP_PASSWORD }}
          LG_SOTF_AUTH__JWT_SECRET: ${{ secrets.LG_SOTF_AUTH__JWT_SECRET }}
          LG_SOTF_SECURITY__ENCRYPTION_KEYS: ${{ secrets.LG_SOTF_SECURITY__ENCRYPTION_KEYS }}
          LG_SOTF_SECURITY__INDICATOR_HMAC_KEY: ${{ secrets.LG_SOTF_SECURITY__INDICATOR_HMAC_KEY }}
          LG_SOTF_API__METRICS_TOKEN: ${{ secrets.LG_SOTF_API__METRICS_TOKEN }}
          LG_SOTF_AUTH__BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.LG_SOTF_AUTH__BOOTSTRAP_ADMIN_PASSWORD }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}
        run: |
          missing=()
          for k in POSTGRES_SUPERUSER_PASSWORD LGSOTF_OWNER_PASSWORD LGSOTF_APP_PASSWORD \
                   LG_SOTF_AUTH__JWT_SECRET LG_SOTF_SECURITY__ENCRYPTION_KEYS \
                   LG_SOTF_SECURITY__INDICATOR_HMAC_KEY LG_SOTF_API__METRICS_TOKEN \
                   LG_SOTF_AUTH__BOOTSTRAP_ADMIN_PASSWORD BOOTSTRAP_ADMIN_EMAIL; do
            [ -n "${!k}" ] || missing+=("$k")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing in environment $TARGET_ENV: ${missing[*]} (see docs/cicd.md)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve image digests and source commit
        id: images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          # Read access for private packages; public packages need none.
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r '.digest // empty'
          }
          app="${INPUT_APP_DIGEST:-$(digest_of "$APP_REPO:$IMAGE_TAG")}"
          fe="${INPUT_FRONTEND_DIGEST:-$(digest_of "$FRONTEND_REPO:$IMAGE_TAG")}"
          [[ "$app" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "no image $APP_REPO:$IMAGE_TAG"
          [[ "$fe" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "no image $FRONTEND_REPO:$IMAGE_TAG"
          # The source commit is the image's own revision label (set by Release images).
          commit="$INPUT_COMMIT"
          if [ -z "$commit" ]; then
            commit="$(docker buildx imagetools inspect "$APP_REPO@$app" --format '{{json .Image}}' \
              | jq -r '(if has("config") then . else .["linux/amd64"] end).config.Labels["org.opencontainers.image.revision"] // empty')"
          fi
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || fail "cannot tell which commit built $APP_REPO:$IMAGE_TAG"
          git cat-file -e "${commit}^{commit}" 2>/dev/null || fail "commit $commit is not in this repository"
          git cat-file -e "${commit}:deploy/vm/deploy.sh" 2>/dev/null \
            || fail "commit $commit predates deploy/vm; deploy a newer image"
          # Bundles from before the ingress option only know Caddy (and no --ingress flag).
          if git cat-file -e "${commit}:deploy/vm/docker-compose.funnel.yml" 2>/dev/null; then
            ingress_supported=true
          else
            ingress_supported=false
            [ "$INGRESS" = "caddy" ] \
              || fail "commit $commit predates the Tailscale Funnel ingress; deploy a newer image"
          fi
          {
            echo "app_ref=$APP_REPO@$app"
            echo "frontend_ref=$FRONTEND_REPO@$fe"
            echo "app_digest=$app"
            echo "frontend_digest=$fe"
            echo "commit=$commit"
            echo "ingress_supported=$ingress_supported"
          } >> "$GITHUB_OUTPUT"
          docker logout ghcr.io >/dev/null

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      # Fail closed: no signed provenance from the release workflow, no deploy.
      - name: Verify image signatures and provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          APP_REF: ${{ steps.images.outputs.app_ref }}
          FRONTEND_REF: ${{ steps.images.outputs.frontend_ref }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null
          for ref in "$APP_REF" "$FRONTEND_REF"; do
            cosign verify --certificate-identity "$SIGNER_IDENTITY" \
              --certificate-oidc-issuer "$SIGNER_OIDC_ISSUER" "$ref" >/dev/null \
              || fail "$ref has no valid signature from $SIGNER_IDENTITY"
            gh attestation verify "oci://$ref" --repo "$SIGNER_REPO" \
              --cert-identity "$SIGNER_IDENTITY" --cert-oidc-issuer "$SIGNER_OIDC_ISSUER" \
              --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners >/dev/null \
              || fail "$ref has no valid build provenance from $SIGNER_IDENTITY"
            echo "verified: $ref"
          done
          docker logout ghcr.io >/dev/null

      - name: Build the deploy bundle
        env:
          COMMIT: ${{ steps.images.outputs.commit }}
        run: |
          git archive --format=tar.gz -o "$RUNNER_TEMP/bundle.tgz" "$COMMIT" \
            deploy/vm docker/docker-compose.yml docker/docker-compose.prod.yml \
            docker/postgres/init-roles.sh docker/empty-ca.crt
          tar -tzf "$RUNNER_TEMP/bundle.tgz" | sed 's/^/  /'

      # Ephemeral node tagged tag:ci (the tailnet policy lets it reach only
      # tag:lgsotf-host on tcp:22); logged out again by the action's post step.
      # No cache: binaries restored from the Actions cache (a key any workflow
      # of this repository can write) are installed without the checksum check
      # a download gets, and run as root in a job holding every deploy secret.
      - name: Join the tailnet (ephemeral tag:ci node)
        if: env.DEPLOY_VIA_TAILSCALE == 'true'
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ env.DEPLOY_HOST }}
          use-cache: "false"

      - name: Configure SSH (pinned host key)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/ssh"
          mkdir -p "$dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$dir/id_deploy"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" | tr -d '\r' > "$dir/known_hosts"
          cat > "$dir/config" <<EOF
          Host lgsotf-target
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile $dir/id_deploy
            IdentitiesOnly yes
            UserKnownHostsFile $dir/known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 8
          EOF
          echo "SSH_CONFIG=$dir/config" >> "$GITHUB_ENV"
          ssh -F "$dir/config" lgsotf-target true

      - name: Upload the bundle
        env:
          COMMIT: ${{ steps.images.outputs.commit }}
        run: |
          release="$REMOTE_ROOT/env/$TARGET_ENV/releases/$COMMIT"
          ssh -F "$SSH_CONFIG" lgsotf-target \
            "set -eu; rm -rf '$release.tmp'; mkdir -p '$release.tmp'; tar -xzf - -C '$release.tmp'; rm -rf '$release'; mv '$release.tmp' '$release'" \
            < "$RUNNER_TEMP/bundle.tgz"

      - name: Deploy (automatic rollback on failed health checks)
        env:
          COMMIT: ${{ steps.images.outputs.commit }}
          APP_REF: ${{ steps.images.outputs.app_ref }}
          FRONTEND_REF: ${{ steps.images.outputs.frontend_ref }}
          # Sent on stdin only (see deploy/vm/deploy.sh for the accepted keys).
          POSTGRES_SUPERUSER_PASSWORD: ${{ secrets.POSTGRES_SUPERUSER_PASSWORD }}
          LGSOTF_OWNER_PASSWORD: ${{ secrets.LGSOTF_OWNER_PASSWORD }}
          LGSOTF_APP_PASSWORD: ${{ secrets.LGSOTF_APP_PASSWORD }}
          LG_SOTF_AUTH__JWT_SECRET: ${{ secrets.LG_SOTF_AUTH__JWT_SECRET }}
          LG_SOTF_SECURITY__ENCRYPTION_KEYS: ${{ secrets.LG_SOTF_SECURITY__ENCRYPTION_KEYS }}
          LG_SOTF_SECURITY__INDICATOR_HMAC_KEY: ${{ secrets.LG_SOTF_SECURITY__INDICATOR_HMAC_KEY }}
          LG_SOTF_API__METRICS_TOKEN: ${{ secrets.LG_SOTF_API__METRICS_TOKEN }}
          LG_SOTF_AUTH__BOOTSTRAP_ADMIN_EMAIL: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}
          LG_SOTF_AUTH__BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.LG_SOTF_AUTH__BOOTSTRAP_ADMIN_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LG_SOTF_LLM__PROVIDER: ${{ vars.LLM_PROVIDER }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LG_SOTF_LLM__BASE_URL: ${{ vars.LLM_BASE_URL }}
          LG_SOTF_LLM__FAST__MODEL: ${{ vars.LLM_FAST_MODEL }}
          LG_SOTF_LLM__DEEP__MODEL: ${{ vars.LLM_DEEP_MODEL }}
          LG_SOTF_LLM__STRUCTURED_OUTPUT: ${{ vars.LLM_STRUCTURED_OUTPUT }}
          LG_SOTF_LLM__FAST__MAX_CONCURRENCY: ${{ vars.LLM_MAX_CONCURRENCY }}
          LG_SOTF_LLM__DEEP__MAX_CONCURRENCY: ${{ vars.LLM_MAX_CONCURRENCY }}
          LG_SOTF_WORKER__CONCURRENCY: ${{ vars.WORKER_CONCURRENCY }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          GHCR_USER: ${{ vars.GHCR_READ_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          # Funnel only; needed for the first deploy of the environment's node.
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          INGRESS_SUPPORTED: ${{ steps.images.outputs.ingress_supported }}
        run: |
          keys=(POSTGRES_SUPERUSER_PASSWORD LGSOTF_OWNER_PASSWORD LGSOTF_APP_PASSWORD
                LG_SOTF_AUTH__JWT_SECRET LG_SOTF_SECURITY__ENCRYPTION_KEYS LG_SOTF_SECURITY__INDICATOR_HMAC_KEY
                LG_SOTF_API__METRICS_TOKEN LG_SOTF_AUTH__BOOTSTRAP_ADMIN_EMAIL LG_SOTF_AUTH__BOOTSTRAP_ADMIN_PASSWORD
                ANTHROPIC_API_KEY LG_SOTF_LLM__PROVIDER ACME_EMAIL GHCR_USER GHCR_TOKEN
                GOOGLE_API_KEY OPENAI_API_KEY LG_SOTF_LLM__BASE_URL LG_SOTF_LLM__FAST__MODEL LG_SOTF_LLM__DEEP__MODEL
                LG_SOTF_LLM__STRUCTURED_OUTPUT
                LG_SOTF_LLM__FAST__MAX_CONCURRENCY LG_SOTF_LLM__DEEP__MAX_CONCURRENCY LG_SOTF_WORKER__CONCURRENCY)
          if [ "$INGRESS" = "funnel" ]; then
            keys+=(TS_AUTHKEY)
          fi
          ingress_opt=""
          if [ "$INGRESS_SUPPORTED" = "true" ]; then
            ingress_opt="--ingress '$INGRESS'"
          fi
          release="$REMOTE_ROOT/env/$TARGET_ENV/releases/$COMMIT"
          # printf is a shell builtin: values never appear in a process's argv.
          for k in "${keys[@]}"; do
            [ -z "${!k}" ] || printf '%s=%s\n' "$k" "${!k}"
          done | ssh -F "$SSH_CONFIG" lgsotf-target \
            "bash '$release/deploy/vm/deploy.sh' --env '$TARGET_ENV' --domain '$APP_DOMAIN' $ingress_opt --root '$REMOTE_ROOT' --app-image '$APP_REF' --frontend-image '$FRONTEND_REF' --version '$IMAGE_TAG' --secrets-stdin"

      - name: Job summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
          COMMIT: ${{ steps.images.outputs.commit }}
          APP_REF: ${{ steps.images.outputs.app_ref }}
          FRONTEND_REF: ${{ steps.images.outputs.frontend_ref }}
          HAS_TS_AUTHKEY: ${{ secrets.TS_AUTHKEY != '' }}
        run: |
          case "$INGRESS" in
            funnel) ingress_label="Tailscale Funnel" ;;
            *) ingress_label="Caddy (Let's Encrypt)" ;;
          esac
          route="SSH to $DEPLOY_HOST"
          if [ "$DEPLOY_VIA_TAILSCALE" = "true" ]; then
            route="SSH over the tailnet to $DEPLOY_HOST"
          fi
          authkey_note=""
          [ "$HAS_TS_AUTHKEY" = "true" ] || authkey_note="missing"
          {
            echo "### Deploy to \`$TARGET_ENV\`: $OUTCOME"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| URL | https://$APP_DOMAIN |"
            echo "| Ingress | \`$INGRESS\` ($ingress_label) |"
            echo "| Deploy route | $route |"
            echo "| Version (image tag) | \`$IMAGE_TAG\` |"
            echo "| Commit | \`${COMMIT:-unresolved}\` |"
            echo "| Backend | \`${APP_REF:-unresolved}\` |"
            echo "| Frontend | \`${FRONTEND_REF:-unresolved}\` |"
            echo ""
            if [ "$INGRESS" = "funnel" ] && [ "$authkey_note" = "missing" ]; then
              echo "> **Note:** the \`TS_AUTHKEY\` secret is not set. That is fine once this environment's Tailscale node"
              echo "> has registered; the first Funnel deploy (or one after its state was lost) needs it and stops early without it."
              echo ""
            fi
            if [ "$OUTCOME" != "success" ]; then
              echo "If the new version failed its health checks, the host rolled back to the previous version"
              echo "(see the Deploy step log). To roll back by hand, run this workflow with the previous tag."
              if [ "$INGRESS" = "funnel" ]; then
                echo "An \"INGRESS FAILED\" line in the log means the version is deployed and healthy but Tailscale"
                echo "Funnel does not publish it; the lines after it name the likely cause."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh" "$RUNNER_TEMP/bundle.tgz"
