name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly: full-history secret scan and fresh dependency advisories.
  schedule:
    - cron: "17 3 * * 1"

# Cancel superseded runs of the same branch / pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: every job only reads the repository. No job pushes images,
# writes packages, or comments; add per-job permissions if that changes.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  HELM_VERSION: v3.16.4
  # oasdiff and kubeconform run from their images, pinned by digest: no release-asset downloads.
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.6.7@sha256:0925177fb05b44ce18574076141b5c3d83235e1904d3f952182ac99ddc45762c
  KUBERNETES_VERSION: 1.29.0
  OASDIFF_IMAGE: tufin/oasdiff:v1.34.1@sha256:67a23cfea7d251e2ae34ee703ac8733c5d96bc2e7b90fd0f4d475ec99367b85f
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Image CVE gate (docs/security.md, section 9). Same Trivy release in every workflow.
  TRIVY_VERSION: v0.76.1

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Ruff
        run: ruff check --output-format=github src tests scripts docker examples
      - name: Mypy (every file in pyproject.toml [tool.mypy] files)
        run: mypy
      - name: Import contracts (pyproject.toml [tool.importlinter], docs/adr/0001-layering.md)
        run: lint-imports
      - name: Shellcheck
        # Every deploy script (deploy/vm: VMs and the Funnel mode; deploy/pc: the self-hosted PC).
        run: |
          shopt -s nullglob
          shellcheck docker/postgres/init-roles.sh scripts/smoke_stack.sh scripts/e2e_ui_stack.sh scripts/make_tour_media.sh \
            scripts/lock_requirements.sh scripts/ci/release_assets.sh scripts/ci/upgrade_rehearsal.sh scripts/ci/release_train.sh scripts/ci/oasdiff.sh \
            src/lg_front/docker/entrypoint.sh deploy/vm/*.sh deploy/pc/*.sh

  fast:
    name: Unit and deploy tests (no services)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No LG_SOTF_TEST_* variables: proves the unit and deploy tiers need no PostgreSQL or Redis,
    # and gives feedback in about two minutes.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Pytest (unit and deploy)
        run: pytest tests/unit tests/invariants tests/deploy

  api-compat:
    name: API compatibility (oasdiff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # scripts/ci/check_api_compat.py: a breaking change to a stable operation of docs/openapi.json fails;
    # beta and internal operations are reported only (docs/api.md, "Stability and deprecation").
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the base branch's docs/openapi.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Pull oasdiff
        run: docker pull "${OASDIFF_IMAGE}" && docker run --rm "${OASDIFF_IMAGE}" --version
      - name: Self-test (breaking a stable operation fails, breaking a beta one does not)
        env:
          OASDIFF: scripts/ci/oasdiff.sh # the pinned image, as a binary
        run: python scripts/ci/check_api_compat.py --self-test docs/openapi.json
      - name: Breaking changes against the base
        # Pull request: the merge base with the target branch. Push: the previous commit of the branch.
        env:
          OASDIFF: scripts/ci/oasdiff.sh
        run: |
          if [ -n "${GITHUB_BASE_REF}" ]; then
            BASE="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)"
          else
            BASE="$(git rev-parse HEAD^)"
          fi
          if ! git cat-file -e "${BASE}:docs/openapi.json" 2>/dev/null; then
            echo "No docs/openapi.json at ${BASE}; nothing to compare."
            exit 0
          fi
          git show "${BASE}:docs/openapi.json" > /tmp/openapi-base.json
          python scripts/ci/check_api_compat.py /tmp/openapi-base.json docs/openapi.json

  schemas:
    name: Published schemas (SemVer breaking-change check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # schemas/<name>/v<major>.json against the base revision: a change needs the version bump it
    # implies, and a breaking one a new major file (docs/evidence-facts.md). The unit tier checks
    # that each file matches its Pydantic model (scripts/export_schemas.py --check).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the base revision's schemas
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Compare with the base revision
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ci/schema_compat.py --base "${BASE_REF}"

  test:
    name: Tests (PostgreSQL 16, Redis 7)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        # The image makes POSTGRES_USER a superuser, and superusers bypass
        # row-level security; the tests connect as a separate plain role.
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_superuser_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      LG_SOTF_TEST_DATABASE_URL: postgresql://soc:ci_only_password@127.0.0.1:5432/soc_test
      LG_SOTF_TEST_REDIS_URL: redis://127.0.0.1:6379/5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Create the non-superuser test role
        env:
          PGPASSWORD: ci_only_superuser_password
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f scripts/ci/create_test_role.sql
      # tests/deploy renders the chart; without helm those tests skip.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Pytest
        # --cov-fail-under: the total floor (one point below the 2026-11-05 baseline of 92.1%); raise it, never lower it.
        run: >-
          pytest
          --cov=lg_sotf --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json
          --cov-fail-under=91
          --junitxml=junit.xml
      - name: Coverage floors per package (runtime, security, api/auth)
        run: python scripts/ci/coverage_floors.py coverage.json
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            coverage.xml
            coverage.json
            junit.xml
          retention-days: 14

  eval-gate:
    name: Evaluation gate (fake model, committed baselines)
    # ARCH-E2.1: `lg-sotf eval` on the synthetic and phishing sets with the offline fake model,
    # against each set's thresholds and its committed baseline (tests/fixtures/eval/baselines/).
    # One more missed attack, or one fewer benign alert closed, than the baseline fails the build.
    # No model is called and no secret is read: the script forces llm.provider=fake. After an
    # intended change run `make eval-baselines` and commit the result (docs/evaluation.md,
    # "Evaluation gate in CI").
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_superuser_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      LG_SOTF_LLM__PROVIDER: fake
      LG_SOTF_DATABASE__URL: postgresql://soc:ci_only_password@127.0.0.1:5432/soc_test
      LG_SOTF_REDIS__URL: redis://127.0.0.1:6379/7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Create the non-superuser test role
        env:
          PGPASSWORD: ci_only_superuser_password
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f scripts/ci/create_test_role.sql
      - name: Migrate the evaluation database
        run: lg-sotf migrate
      - name: Evaluation gate (synthetic and phishing sets)
        run: python scripts/ci/eval_gate.py pr --out eval-gate
      - name: Upload the evaluation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-gate
          path: eval-gate/
          retention-days: 14
          if-no-files-found: ignore

  test-parallel:
    name: Tests in parallel (pytest-xdist, non-blocking trial)
    # Roadmap Q4: four xdist workers, each with its own database (soc_test_gw<N>, created by
    # tests/integration/conftest.py) and Redis database (5 + N). Non-blocking until about ten green
    # runs match the serial job (the parallel-parity job); then it becomes blocking and the serial
    # job keeps only coverage. Locally: `make test-parallel`, `make test-serial`.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_superuser_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      LG_SOTF_TEST_DATABASE_URL: postgresql://soc:ci_only_password@127.0.0.1:5432/soc_test
      LG_SOTF_TEST_REDIS_URL: redis://127.0.0.1:6379/5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Create the non-superuser test role
        env:
          PGPASSWORD: ci_only_superuser_password
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f scripts/ci/create_test_role.sql
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Pytest (4 workers, one file per worker at a time)
        run: pytest -n 4 --dist loadfile --junitxml=junit-parallel.xml
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-parallel
          path: junit-parallel.xml
          retention-days: 14

  parallel-parity:
    name: Parallel and serial runs agree (non-blocking trial)
    needs: [test, test-parallel]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-reports-parallel
      - name: Same tests, same outcomes
        run: python3 scripts/ci/compare_junit.py junit.xml junit-parallel.xml

  wazuh-contract:
    name: Wazuh 4.14 live contract tests (non-blocking trial)
    # Roadmap INT3.1: the real Wazuh connector against a Wazuh 4.14 indexer seeded with the template
    # Wazuh publishes (docker/docker-compose.wazuh-test.yml, tests/live/wazuh). Non-blocking while the
    # 2.5 GB image pull and the lab's start time settle; locally: `make test-wazuh-up test-wazuh`.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Start and seed the Wazuh lab
        run: make test-wazuh-up PYTHON=python
      - name: Pytest (tests/live/wazuh)
        run: make test-wazuh PYTHON=python PYTEST_ARGS="--junitxml=junit-wazuh.xml"
      - name: Indexer logs
        if: failure()
        run: docker compose -f docker/docker-compose.wazuh-test.yml logs --tail=200 indexer
      - name: Stop the Wazuh lab
        if: always()
        run: make test-wazuh-down
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-wazuh
          path: junit-wazuh.xml
          retention-days: 14
          if-no-files-found: ignore

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install scanners
        run: pip install --require-hashes -r scripts/ci/requirements-tools.txt
      - name: pip-audit (every hash-locked requirements file)
        run: |
          for lock in requirements.txt requirements-dev.txt docker/requirements-build.txt \
              scripts/ci/requirements-tools.txt scripts/ci/requirements-nightly.txt; do
            pip-audit --strict --progress-spinner off --disable-pip --require-hashes -r "$lock"
          done
      - name: Bandit (new medium+ findings against the reviewed baseline)
        run: bandit -r src/lg_sotf examples -ll -ii -b scripts/ci/bandit-baseline.json
      - name: Gitleaks (commits in this change)
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "${BASE_REF}" ] || [ "${BASE_REF}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="-1"
          else
            RANGE="${BASE_REF}..HEAD"
          fi
          docker run --rm -v "${PWD}:/repo:ro" "${GITLEAKS_IMAGE}" git /repo \
            --config /repo/scripts/ci/gitleaks.toml --redact --no-banner --exit-code 1 \
            --log-opts="${RANGE}"
      - name: Gitleaks (current tree)
        run: |
          docker run --rm -v "${PWD}:/repo:ro" "${GITLEAKS_IMAGE}" dir /repo \
            --config /repo/scripts/ci/gitleaks.toml --redact --no-banner --exit-code 1

  gitleaks-history:
    name: Secret scan (full history)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Every commit on every fetched ref. Already-known historical findings
      # are listed by fingerprint in scripts/ci/gitleaks-history.ignore; any
      # other finding fails the job.
      - name: Gitleaks (all history)
        run: |
          docker run --rm -v "${PWD}:/repo:ro" "${GITLEAKS_IMAGE}" git /repo \
            --config /repo/scripts/ci/gitleaks.toml \
            --gitleaks-ignore-path /repo/scripts/ci/gitleaks-history.ignore \
            --redact --no-banner --exit-code 1 --log-opts="--all"

  docker:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: lg-sotf:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          docker run --rm lg-sotf:ci version
          test "$(docker run --rm --entrypoint id lg-sotf:ci -u)" = "10001"
          docker run --rm --read-only --tmpfs /tmp lg-sotf:ci --help >/dev/null
          # The health probe reports healthy for one-shot commands.
          docker run --rm --entrypoint python lg-sotf:ci /usr/local/lib/lg-sotf/healthcheck.py
          # No package manager and no setuid/setgid binaries in the runtime image.
          test -z "$(docker run --rm --entrypoint sh lg-sotf:ci -c 'command -v pip pip3; ls /usr/local/lib/python3*/site-packages | grep -E "^(pip|setuptools|wheel)"; find / -xdev -type f -perm /6000 2>/dev/null')"
      - name: Image CVE gate (Trivy, fixable critical and high)
        # Fails on any critical or high finding that has a fix, in OS packages or Python
        # libraries. Exceptions: .trivyignore (reviewed, each with an expiry date).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: lg-sotf:ci
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
      - name: Image SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: lg-sotf:ci
          format: cyclonedx
          output: lg-sotf-ci-image.cdx.json
      - name: Upload the image SBOM (validated by the sbom job)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom-lg-sotf
          path: lg-sotf-ci-image.cdx.json
          if-no-files-found: error
          retention-days: 7
      - name: Validate compose files
        env:
          POSTGRES_SUPERUSER_PASSWORD: ci
          LGSOTF_OWNER_PASSWORD: ci
          LGSOTF_APP_PASSWORD: ci
          LG_SOTF_AUTH__JWT_SECRET: ci
          LG_SOTF_SECURITY__ENCRYPTION_KEYS: ci
          LG_SOTF_SECURITY__INDICATOR_HMAC_KEY: ci
        run: |
          docker compose -f docker/docker-compose.yml config -q
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml config -q
          # VM overlays (deploy/vm, docs/cicd.md) with the values deploy.sh renders, for
          # both ingress modes: Caddy (default) and Tailscale Funnel (docs/self-hosting-pc.md).
          export APP_IMAGE=ghcr.io/gapilongo/lg-sotf:ci FRONTEND_IMAGE=ghcr.io/gapilongo/lg-sotf-frontend:ci \
            LGSOTF_ENV=dev LGSOTF_ENV_DIR=/opt/lg-sotf/env/dev
          stack=(-f docker/docker-compose.yml -f docker/docker-compose.prod.yml -f deploy/vm/docker-compose.vm.yml)
          LG_SOTF_API__FORWARDED_ALLOW_IPS=172.31.250.10,172.31.251.2 docker compose "${stack[@]}" config -q
          LG_SOTF_API__FORWARDED_ALLOW_IPS=172.31.250.10,172.31.251.2 \
            docker compose "${stack[@]}" -f deploy/vm/docker-compose.caddy.yml config -q
          EDGE_SUBNET=10.202.1.0/29 EDGE_FRONTEND_IP=10.202.1.2 EDGE_API_IP=10.202.1.3 \
          LG_SOTF_API__FORWARDED_ALLOW_IPS=10.202.1.2 TS_HOSTNAME=soc-dev TS_STATE_VOLUME=lgsotf-dev-tailscale \
            docker compose "${stack[@]}" -f deploy/vm/docker-compose.funnel.yml config -q
          docker compose -f deploy/vm/docker-compose.edge.yml config -q
      - name: Stack smoke test (compose, HTTP API only)
        # Full customer path against the image built above: ingest, review, approvals, isolation,
        # sessions, worker SIGKILL/restart without losing alerts, Redis outage and recovery.
        env:
          APP_IMAGE: lg-sotf:ci
        run: scripts/smoke_stack.sh --no-build

  upgrade:
    name: Upgrade rehearsal (N-1 runs waiting for an analyst, migrate, decide on N)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # scripts/ci/upgrade_rehearsal.sh: the previous release (latest v* tag) migrates a fresh database and
    # leaves runs waiting for an analyst; this checkout migrates it as the schema owner and must resume and
    # close every one of them through its API. Any run that fails, dead-letters or stays open fails the build.
    # The same again from the latest LTS release (lts-X.Y), when it is not the previous release
    # (docs/releases.md). The release train tags nothing whose run of this job failed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the previous release's tag and tree
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install --require-hashes -r requirements.txt
      - name: Rehearse the upgrade from the previous release
        run: scripts/ci/upgrade_rehearsal.sh
      - name: Rehearse the upgrade from the latest LTS release
        run: scripts/ci/upgrade_rehearsal.sh --from lts

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Pull kubeconform
        run: docker pull "${KUBECONFORM_IMAGE}" && docker run --rm "${KUBECONFORM_IMAGE}" -v
      - name: Lint
        run: |
          helm lint --strict deploy/helm/lg-sotf
          helm lint --strict deploy/helm/lg-sotf -f deploy/helm/lg-sotf/ci/full-values.yaml
      - name: Template and validate
        run: |
          helm template ci deploy/helm/lg-sotf > /tmp/default.yaml
          helm template ci deploy/helm/lg-sotf -f deploy/helm/lg-sotf/ci/full-values.yaml > /tmp/full.yaml
          docker run --rm -v /tmp:/tmp:ro "${KUBECONFORM_IMAGE}" -strict -summary -kubernetes-version "${KUBERNETES_VERSION}" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/default.yaml /tmp/full.yaml

  sbom:
    name: SBOMs and VEX (schema validation)
    # The release assets (docs/security.md, section 9), built the way release-images.yml builds them
    # and validated against the CycloneDX and OpenVEX schemas, so a format break shows up here and not
    # on release day.
    needs: [docker, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install SBOM tooling
        run: pip install --require-hashes -r scripts/ci/requirements-tools.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-sbom-*
          path: image-sbom
          merge-multiple: true
      - name: Python and npm SBOMs, VEX (validated)
        run: scripts/ci/release_assets.sh release-assets ci
      - name: Image SBOMs (validated)
        run: python scripts/ci/validate_sbom.py image-sbom/lg-sotf-ci-image.cdx.json image-sbom/lg-sotf-frontend-ci-image.cdx.json

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect frontend
        id: detect
        run: |
          if [ -f src/lg_front/package.json ] && [ -f src/lg_front/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No frontend package with a lockfile; skipping."
          fi
          if [ -f src/lg_front/Dockerfile ]; then
            echo "dockerfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerfile=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/lg_front/package-lock.json
      - name: Install, lint, test, build
        if: steps.detect.outputs.present == 'true'
        working-directory: src/lg_front
        env:
          CI: "true"
        run: |
          npm ci --no-audit --no-fund
          npm run audit:prod
          npm run lint --if-present
          # FE10: the generated API types must match the committed OpenAPI document; src/api/contract.check.ts
          # then holds the hand-written types to them in the build's type check.
          npm run gen:api
          git diff --exit-code -- src/api/schema.gen.ts
          # Unit tests with coverage, then the per-area floors in coverage-floors.json (FE1 ratchet).
          npm run test:ci
          npm run build --if-present
      - name: Build frontend image (no push)
        if: steps.detect.outputs.dockerfile == 'true'
        run: docker build -t lg-sotf-frontend:ci src/lg_front
      - name: Image CVE gate (Trivy, fixable critical and high)
        if: steps.detect.outputs.dockerfile == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: lg-sotf-frontend:ci
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
      - name: Image SBOM (CycloneDX)
        if: steps.detect.outputs.dockerfile == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: lg-sotf-frontend:ci
          format: cyclonedx
          output: lg-sotf-frontend-ci-image.cdx.json
      - name: Upload the image SBOM (validated by the sbom job)
        if: steps.detect.outputs.dockerfile == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom-lg-sotf-frontend
          path: lg-sotf-frontend-ci-image.cdx.json
          if-no-files-found: error
          retention-days: 7

  e2e-ui:
    name: Web UI end-to-end (Playwright, compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/lg_front/package-lock.json
      - name: Install the frontend dependencies and Chromium
        working-directory: src/lg_front
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      # Builds the api and frontend images, starts the production-like compose
      # stack with the web UI (fake LLM, bootstrap admin), runs e2e/ in Chromium
      # (sign-in, live Overview, filters and pagination, timeline, escalation
      # decision, approval, role gating, sign-out, CSP) and checks the container
      # logs for tokens; tears the stack down afterwards.
      - name: Run the suite against the stack
        env:
          CI: "true"
          APP_IMAGE: lg-sotf:e2e
          FRONTEND_IMAGE: lg-sotf-frontend:e2e
          E2E_SCREENSHOTS: ${{ github.workspace }}/e2e-screenshots
        run: scripts/e2e_ui_stack.sh
      - name: Upload the report, traces and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-ui
          path: |
            src/lg_front/playwright-report
            src/lg_front/test-results
            e2e-screenshots
          if-no-files-found: ignore
          retention-days: 14
