name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly: full-history secret scan and fresh dependency advisories.
  schedule:
    - cron: "17 3 * * 1"

# Cancel superseded runs of the same branch / pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: every job only reads the repository. No job pushes images,
# writes packages, or comments; add per-job permissions if that changes.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  HELM_VERSION: v3.16.4
  KUBECONFORM_VERSION: v0.6.7
  KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
  KUBERNETES_VERSION: 1.29.0
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Ruff
        run: ruff check --output-format=github src tests scripts docker examples
      - name: Mypy (every file in pyproject.toml [tool.mypy] files)
        run: mypy
      - name: Import contracts (pyproject.toml [tool.importlinter], docs/adr/0001-layering.md)
        run: lint-imports
      - name: Shellcheck
        # Every deploy script (deploy/vm: VMs and the Funnel mode; deploy/pc: the self-hosted PC).
        run: |
          shopt -s nullglob
          shellcheck docker/postgres/init-roles.sh scripts/smoke_stack.sh scripts/e2e_ui_stack.sh scripts/make_tour_media.sh \
            scripts/ci/upgrade_rehearsal.sh src/lg_front/docker/entrypoint.sh deploy/vm/*.sh deploy/pc/*.sh

  fast:
    name: Unit and deploy tests (no services)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No LG_SOTF_TEST_* variables: proves the unit and deploy tiers need no PostgreSQL or Redis,
    # and gives feedback in about two minutes.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Pytest (unit and deploy)
        run: pytest tests/unit tests/deploy

  test:
    name: Tests (PostgreSQL 16, Redis 7)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        # The image makes POSTGRES_USER a superuser, and superusers bypass
        # row-level security; the tests connect as a separate plain role.
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_superuser_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      LG_SOTF_TEST_DATABASE_URL: postgresql://soc:ci_only_password@127.0.0.1:5432/soc_test
      LG_SOTF_TEST_REDIS_URL: redis://127.0.0.1:6379/5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Create the non-superuser test role
        env:
          PGPASSWORD: ci_only_superuser_password
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f scripts/ci/create_test_role.sql
      # tests/deploy renders the chart; without helm those tests skip.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Pytest
        # --cov-fail-under: the total floor (one point below the 2026-11-05 baseline of 92.1%); raise it, never lower it.
        run: >-
          pytest
          --cov=lg_sotf --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json
          --cov-fail-under=91
          --junitxml=junit.xml
      - name: Coverage floors per package (runtime, security, api/auth)
        run: python scripts/ci/coverage_floors.py coverage.json
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            coverage.xml
            coverage.json
            junit.xml
          retention-days: 14

  test-parallel:
    name: Tests in parallel (pytest-xdist, non-blocking trial)
    # Roadmap Q4: four xdist workers, each with its own database (soc_test_gw<N>, created by
    # tests/integration/conftest.py) and Redis database (5 + N). Non-blocking until about ten green
    # runs match the serial job (the parallel-parity job); then it becomes blocking and the serial
    # job keeps only coverage. Locally: `make test-parallel`, `make test-serial`.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_superuser_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      LG_SOTF_TEST_DATABASE_URL: postgresql://soc:ci_only_password@127.0.0.1:5432/soc_test
      LG_SOTF_TEST_REDIS_URL: redis://127.0.0.1:6379/5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Create the non-superuser test role
        env:
          PGPASSWORD: ci_only_superuser_password
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f scripts/ci/create_test_role.sql
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Pytest (4 workers, one file per worker at a time)
        run: pytest -n 4 --dist loadfile --junitxml=junit-parallel.xml
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-parallel
          path: junit-parallel.xml
          retention-days: 14

  parallel-parity:
    name: Parallel and serial runs agree (non-blocking trial)
    needs: [test, test-parallel]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-reports-parallel
      - name: Same tests, same outcomes
        run: python3 scripts/ci/compare_junit.py junit.xml junit-parallel.xml

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install scanners
        run: pip install "pip-audit==2.9.0" "bandit[toml]==1.8.6"
      - name: pip-audit (pinned runtime and dev dependencies)
        run: |
          pip-audit --strict --progress-spinner off --no-deps --disable-pip -r requirements.txt
          pip-audit --strict --progress-spinner off --no-deps --disable-pip -r requirements-dev.txt
      - name: Bandit (new medium+ findings against the reviewed baseline)
        run: bandit -r src/lg_sotf examples -ll -ii -b scripts/ci/bandit-baseline.json
      - name: Gitleaks (commits in this change)
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "${BASE_REF}" ] || [ "${BASE_REF}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="-1"
          else
            RANGE="${BASE_REF}..HEAD"
          fi
          docker run --rm -v "${PWD}:/repo:ro" "${GITLEAKS_IMAGE}" git /repo \
            --config /repo/scripts/ci/gitleaks.toml --redact --no-banner --exit-code 1 \
            --log-opts="${RANGE}"
      - name: Gitleaks (current tree)
        run: |
          docker run --rm -v "${PWD}:/repo:ro" "${GITLEAKS_IMAGE}" dir /repo \
            --config /repo/scripts/ci/gitleaks.toml --redact --no-banner --exit-code 1

  gitleaks-history:
    name: Secret scan (full history)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Every commit on every fetched ref. Already-known historical findings
      # are listed by fingerprint in scripts/ci/gitleaks-history.ignore; any
      # other finding fails the job.
      - name: Gitleaks (all history)
        run: |
          docker run --rm -v "${PWD}:/repo:ro" "${GITLEAKS_IMAGE}" git /repo \
            --config /repo/scripts/ci/gitleaks.toml \
            --gitleaks-ignore-path /repo/scripts/ci/gitleaks-history.ignore \
            --redact --no-banner --exit-code 1 --log-opts="--all"

  docker:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: lg-sotf:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          docker run --rm lg-sotf:ci version
          test "$(docker run --rm --entrypoint id lg-sotf:ci -u)" = "10001"
          docker run --rm --read-only --tmpfs /tmp lg-sotf:ci --help >/dev/null
          # The health probe reports healthy for one-shot commands.
          docker run --rm --entrypoint python lg-sotf:ci /usr/local/lib/lg-sotf/healthcheck.py
          # No package manager and no setuid/setgid binaries in the runtime image.
          test -z "$(docker run --rm --entrypoint sh lg-sotf:ci -c 'command -v pip pip3; ls /usr/local/lib/python3*/site-packages | grep -E "^(pip|setuptools|wheel)"; find / -xdev -type f -perm /6000 2>/dev/null')"
      - name: Validate compose files
        env:
          POSTGRES_SUPERUSER_PASSWORD: ci
          LGSOTF_OWNER_PASSWORD: ci
          LGSOTF_APP_PASSWORD: ci
          LG_SOTF_AUTH__JWT_SECRET: ci
          LG_SOTF_SECURITY__ENCRYPTION_KEYS: ci
          LG_SOTF_SECURITY__INDICATOR_HMAC_KEY: ci
        run: |
          docker compose -f docker/docker-compose.yml config -q
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml config -q
          # VM overlays (deploy/vm, docs/cicd.md) with the values deploy.sh renders, for
          # both ingress modes: Caddy (default) and Tailscale Funnel (docs/self-hosting-pc.md).
          export APP_IMAGE=ghcr.io/gapilongo/lg-sotf:ci FRONTEND_IMAGE=ghcr.io/gapilongo/lg-sotf-frontend:ci \
            LGSOTF_ENV=dev LGSOTF_ENV_DIR=/opt/lg-sotf/env/dev
          stack=(-f docker/docker-compose.yml -f docker/docker-compose.prod.yml -f deploy/vm/docker-compose.vm.yml)
          LG_SOTF_API__FORWARDED_ALLOW_IPS=172.31.250.10,172.31.251.2 docker compose "${stack[@]}" config -q
          LG_SOTF_API__FORWARDED_ALLOW_IPS=172.31.250.10,172.31.251.2 \
            docker compose "${stack[@]}" -f deploy/vm/docker-compose.caddy.yml config -q
          EDGE_SUBNET=10.202.1.0/29 EDGE_FRONTEND_IP=10.202.1.2 EDGE_API_IP=10.202.1.3 \
          LG_SOTF_API__FORWARDED_ALLOW_IPS=10.202.1.2 TS_HOSTNAME=soc-dev TS_STATE_VOLUME=lgsotf-dev-tailscale \
            docker compose "${stack[@]}" -f deploy/vm/docker-compose.funnel.yml config -q
          docker compose -f deploy/vm/docker-compose.edge.yml config -q
      - name: Stack smoke test (compose, HTTP API only)
        # Full customer path against the image built above: ingest, review, approvals, isolation,
        # sessions, worker SIGKILL/restart without losing alerts, Redis outage and recovery.
        env:
          APP_IMAGE: lg-sotf:ci
        run: scripts/smoke_stack.sh --no-build

  upgrade:
    name: Upgrade rehearsal (N-1 runs waiting for an analyst, migrate, decide on N)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # scripts/ci/upgrade_rehearsal.sh: the previous release (latest v* tag) migrates a fresh database and
    # leaves runs waiting for an analyst; this checkout migrates it as the schema owner and must resume and
    # close every one of them through its API. Any run that fails, dead-letters or stays open fails the build.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the previous release's tag and tree
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Rehearse the upgrade from the previous release
        run: scripts/ci/upgrade_rehearsal.sh

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tgz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tgz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Lint
        run: |
          helm lint --strict deploy/helm/lg-sotf
          helm lint --strict deploy/helm/lg-sotf -f deploy/helm/lg-sotf/ci/full-values.yaml
      - name: Template and validate
        run: |
          helm template ci deploy/helm/lg-sotf > /tmp/default.yaml
          helm template ci deploy/helm/lg-sotf -f deploy/helm/lg-sotf/ci/full-values.yaml > /tmp/full.yaml
          kubeconform -strict -summary -kubernetes-version "${KUBERNETES_VERSION}" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/default.yaml /tmp/full.yaml

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect frontend
        id: detect
        run: |
          if [ -f src/lg_front/package.json ] && [ -f src/lg_front/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No frontend package with a lockfile; skipping."
          fi
          if [ -f src/lg_front/Dockerfile ]; then
            echo "dockerfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerfile=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/lg_front/package-lock.json
      - name: Install, lint, test, build
        if: steps.detect.outputs.present == 'true'
        working-directory: src/lg_front
        env:
          CI: "true"
        run: |
          npm ci --no-audit --no-fund
          npm run audit:prod
          npm run lint --if-present
          # FE10: the generated API types must match the committed OpenAPI document; src/api/contract.check.ts
          # then holds the hand-written types to them in the build's type check.
          npm run gen:api
          git diff --exit-code -- src/api/schema.gen.ts
          # Unit tests with coverage, then the per-area floors in coverage-floors.json (FE1 ratchet).
          npm run test:ci
          npm run build --if-present
      - name: Build frontend image (no push)
        if: steps.detect.outputs.dockerfile == 'true'
        run: docker build -t lg-sotf-frontend:ci src/lg_front

  e2e-ui:
    name: Web UI end-to-end (Playwright, compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/lg_front/package-lock.json
      - name: Install the frontend dependencies and Chromium
        working-directory: src/lg_front
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      # Builds the api and frontend images, starts the production-like compose
      # stack with the web UI (fake LLM, bootstrap admin), runs e2e/ in Chromium
      # (sign-in, live Overview, filters and pagination, timeline, escalation
      # decision, approval, role gating, sign-out, CSP) and checks the container
      # logs for tokens; tears the stack down afterwards.
      - name: Run the suite against the stack
        env:
          CI: "true"
          APP_IMAGE: lg-sotf:e2e
          FRONTEND_IMAGE: lg-sotf-frontend:e2e
          E2E_SCREENSHOTS: ${{ github.workspace }}/e2e-screenshots
        run: scripts/e2e_ui_stack.sh
      - name: Upload the report, traces and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-ui
          path: |
            src/lg_front/playwright-report
            src/lg_front/test-results
            e2e-screenshots
          if-no-files-found: ignore
          retention-days: 14
