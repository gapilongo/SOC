# LG-SOTF development / evaluation stack.
#
#   make up                    # or: docker compose -f docker/docker-compose.yml up -d --build
#   make up PROFILES=frontend  # also build and run the web UI on http://localhost:3000
#
# Runs PostgreSQL 16, Redis 7 (AOF), the one-shot migrate job, and the api,
# worker and scheduler roles of the single lg-sotf image. The LLM provider
# defaults to "fake" (deterministic, offline) so the stack works without an API
# key; set LG_SOTF_LLM__PROVIDER=anthropic and ANTHROPIC_API_KEY in .env for
# real triage.
#
# Settings come from, in order of precedence: the `environment:` entries below,
# the repository .env file (optional; see .env.example), and the reference
# config named by LG_SOTF_CONFIG_FILE (configs/development.yaml, which carries
# published placeholder keys that staging/production refuse). For a two-role
# database and production-style secrets add docker-compose.prod.yml.
#
# Image names are overridable so a registry mirror can be used, e.g.
#   PYTHON_BASE_IMAGE=mirror.gcr.io/library/python:3.11-slim
#   POSTGRES_IMAGE=mirror.gcr.io/library/postgres:16-alpine
#   REDIS_IMAGE=mirror.gcr.io/library/redis:7-alpine

name: lg-sotf

x-app-build: &app-build
  context: ..
  dockerfile: docker/Dockerfile
  args:
    BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
  secrets:
    - build_ca

x-app-environment: &app-environment
  LG_SOTF_ENVIRONMENT: ${LG_SOTF_ENVIRONMENT:-development}
  LG_SOTF_CONFIG_FILE: ${LG_SOTF_CONFIG_FILE-/app/configs/development.yaml}
  LG_SOTF_DATABASE__URL: postgresql://soc:${POSTGRES_PASSWORD:-soc_dev_password}@postgres:5432/soc
  LG_SOTF_REDIS__URL: redis://redis:6379/0
  LG_SOTF_LLM__PROVIDER: ${LG_SOTF_LLM__PROVIDER:-fake}
  LG_SOTF_API__HOST: 0.0.0.0
  LG_SOTF_API__PORT: "8000"
  LG_SOTF_OBSERVABILITY__LOG_FORMAT: ${LG_SOTF_OBSERVABILITY__LOG_FORMAT:-json}

# Shared hardening for every lg-sotf container: non-root (image default),
# read-only root filesystem with a private /tmp, no capabilities, no privilege
# escalation.
x-app: &app
  image: ${APP_IMAGE:-lg-sotf:dev}
  env_file:
    - path: ../.env
      required: false
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  init: false  # dumb-init is PID 1 inside the image

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc_dev_password}
      POSTGRES_DB: soc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", ""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    build: *app-build
    command: ["migrate"]
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    # One-shot job: success is its exit code, not a health probe.
    healthcheck:
      disable: true
    restart: "no"

  api:
    <<: *app
    command: ["api"]
    environment:
      <<: *app-environment
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/usr/local/lib/lg-sotf/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *app-environment
    ports:
      - "127.0.0.1:${WORKER_HEALTH_PORT:-9101}:9100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/usr/local/lib/lg-sotf/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    # worker.drain_timeout_s (60) plus margin for in-flight runs to checkpoint.
    stop_grace_period: 75s
    restart: unless-stopped

  scheduler:
    <<: *app
    command: ["scheduler"]
    environment:
      <<: *app-environment
    ports:
      - "127.0.0.1:${SCHEDULER_HEALTH_PORT:-9102}:9100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/usr/local/lib/lg-sotf/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 30s
    restart: unless-stopped

  # Web UI (src/lg_front/Dockerfile): enable with `make up PROFILES=frontend`
  # (or `docker compose --profile frontend up`), then open
  # http://localhost:${FRONTEND_PORT:-3000}. nginx serves the static app and
  # proxies /api (REST and the /api/v1/ws WebSocket) to the api service, so the
  # browser talks to one origin and the refresh cookie stays first-party.
  # Runtime settings are environment variables turned into /config.js at
  # start-up; the image carries no URLs or secrets. Live updates: the API
  # accepts the WebSocket only from origins in api.cors_origins
  # (configs/development.yaml lists http://localhost:3000); opening the UI on
  # another origin (127.0.0.1, another FRONTEND_PORT, a real hostname with the
  # production overlay) needs that origin added there.
  frontend:
    profiles: ["frontend"]
    image: ${FRONTEND_IMAGE:-lg-sotf-frontend:dev}
    build:
      context: ../src/lg_front
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.28-alpine}
      secrets:
        - build_ca
    environment:
      LG_SOTF_API_UPSTREAM: http://api:8000
      LG_SOTF_API_BASE_URL: ${FRONTEND_API_BASE_URL:-}
      LG_SOTF_WS_URL: ${FRONTEND_WS_URL:-}
      LG_SOTF_OIDC_ISSUER: ${FRONTEND_OIDC_ISSUER:-}
      LG_SOTF_OIDC_CLIENT_ID: ${FRONTEND_OIDC_CLIENT_ID:-}
      LG_SOTF_OIDC_SCOPE: ${FRONTEND_OIDC_SCOPE:-}
      LG_SOTF_OIDC_AUDIENCE: ${FRONTEND_OIDC_AUDIENCE:-}
      LG_SOTF_OIDC_TOKEN_TYPE: ${FRONTEND_OIDC_TOKEN_TYPE:-}
      LG_SOTF_OIDC_REDIRECT_URI: ${FRONTEND_OIDC_REDIRECT_URI:-}
      LG_SOTF_OIDC_AUTHORIZATION_ENDPOINT: ${FRONTEND_OIDC_AUTHORIZATION_ENDPOINT:-}
      LG_SOTF_OIDC_TOKEN_ENDPOINT: ${FRONTEND_OIDC_TOKEN_ENDPOINT:-}
      LG_SOTF_OIDC_END_SESSION_ENDPOINT: ${FRONTEND_OIDC_END_SESSION_ENDPOINT:-}
      LG_SOTF_OIDC_LABEL: ${FRONTEND_OIDC_LABEL:-}
      LG_SOTF_CSP_CONNECT_SRC: ${FRONTEND_CSP_CONNECT_SRC:-}
      LG_SOTF_HSTS_MAX_AGE: ${FRONTEND_HSTS_MAX_AGE:-}
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

secrets:
  # Optional CA bundle for builds behind a TLS-intercepting proxy; the default
  # is an empty file so ordinary builds need nothing.
  build_ca:
    file: ${BUILD_CA_FILE:-./empty-ca.crt}
