# LG-SOTF production configuration.
#
# Every secret comes from the environment (Kubernetes Secret / vault agent).
# A variable that is unset leaves the field at its default, and
# settings.assert_safe() refuses to start when a required secret is missing.
# Any value can also be overridden with LG_SOTF_<SECTION>__<KEY>.

environment: production

database:
  url: ${DATABASE_URL}
  pool_min: ${DATABASE_POOL_MIN:-5}
  pool_max: ${DATABASE_POOL_MAX:-20}
  command_timeout_s: 30
  statement_timeout_ms: 30000
  ssl_mode: ${DATABASE_SSL_MODE:-require}
  ssl_root_cert: ${DATABASE_SSL_ROOT_CERT}

redis:
  url: ${REDIS_URL}
  key_prefix: ${REDIS_KEY_PREFIX:-lgsotf}
  max_connections: 128

llm:
  enabled: true
  provider: anthropic
  api_key: ${ANTHROPIC_API_KEY}
  fast:
    model: ${LLM_FAST_MODEL:-claude-haiku-4-5}
    max_tokens: 1024
    temperature: 0.0
    timeout_s: 60
    max_retries: 3
    max_concurrency: 32
  deep:
    model: ${LLM_DEEP_MODEL:-claude-opus-5-5}
    max_tokens: 16000
    timeout_s: 300
    max_retries: 3
    max_concurrency: 16
  prompt_caching: true
  max_input_chars: 24000
  max_field_chars: 2000
  max_list_items: 50
  daily_token_budget_per_tenant: ${LLM_DAILY_TOKEN_BUDGET_PER_TENANT:-5000000}

auth:
  jwt_secret: ${JWT_SECRET}
  jwt_issuer: lg-sotf
  jwt_audience: lg-sotf-api
  access_token_ttl_s: 900
  refresh_token_ttl_s: 1209600
  cookie_secure: true
  cookie_domain: ${COOKIE_DOMAIN}
  password_min_length: 12
  max_login_attempts: 10
  lockout_minutes: 15
  oidc_issuer: ${OIDC_ISSUER}
  oidc_audience: ${OIDC_AUDIENCE}
  oidc_jwks_url: ${OIDC_JWKS_URL}
  oidc_default_tenant: ${OIDC_DEFAULT_TENANT}
  bootstrap_admin_email: ${BOOTSTRAP_ADMIN_EMAIL}
  bootstrap_admin_password: ${BOOTSTRAP_ADMIN_PASSWORD}

api:
  host: 0.0.0.0
  port: 8000
  public_url: ${PUBLIC_URL}
  # The SPA is served same-origin; list extra origins with
  # LG_SOTF_API__CORS_ORIGINS='["https://soc.example.com"]'.
  cors_origins: []
  metrics_token: ${METRICS_TOKEN}
  docs_enabled: false
  forwarded_allow_ips: ${FORWARDED_ALLOW_IPS:-127.0.0.1}

worker:
  concurrency: ${WORKER_CONCURRENCY:-16}
  per_tenant_concurrency: 8

security:
  encryption_keys: ${ENCRYPTION_KEYS}
  indicator_hmac_key: ${INDICATOR_HMAC_KEY}

observability:
  log_level: ${LOG_LEVEL:-INFO}
  log_format: json
  metrics_enabled: true
  otlp_endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
  service_name: lg-sotf

response:
  dry_run: ${RESPONSE_DRY_RUN:-true}
  webhook_url: ${RESPONSE_WEBHOOK_URL}
  webhook_secret: ${RESPONSE_WEBHOOK_SECRET}

agents:
  triage:
    enable_llm_scoring: true
    llm_weight: 0.4
  correlation:
    correlation_window_minutes: 60
    burst_window_minutes: 15
    burst_threshold: 5
    max_correlations: 10
    enable_llm_correlation: true
    llm_weight: 0.3
  analysis:
    max_iterations: 5
    enable_llm_reasoning: true
  # human_loop takes the install defaults of the tenant review policy (sla_minutes,
  # level_thresholds, min_level, grouping, suggest_suppressions); see
  # lg_sotf.services.escalation. Response actions are governed by the top-level
  # ``response`` section (response.dry_run), not by an agents.response block.

routing:
  max_alert_age_hours: 72
  correlation_grey_zone_min: 30
  correlation_grey_zone_max: 70
  analysis_threshold: 40
  human_review_min: 20
  human_review_max: 60
  response_threshold: 80

tools:
  # Read by EnrichmentService as tools.<provider>. Provide the key from a secret store as
  # LG_SOTF_TOOLS__VIRUSTOTAL__API_KEY (never in a ConfigMap or this file).
  virustotal:
    api_key: ${VIRUSTOTAL_API_KEY}
    timeout_s: 15
    requests_per_minute: 4

ingestion:
  llm_fallback: false
