# LG-SOTF production configuration.
#
# Every secret comes from the environment (Kubernetes Secret / vault agent).
# A variable that is unset leaves the field at its default, and
# settings.assert_safe() refuses to start when a required secret is missing.
# Any value can also be overridden with LG_SOTF_<SECTION>__<KEY>.

environment: production

database:
  url: ${DATABASE_URL}
  pool_min: ${DATABASE_POOL_MIN:-5}
  pool_max: ${DATABASE_POOL_MAX:-20}
  command_timeout_s: 30
  statement_timeout_ms: 30000
  ssl_mode: ${DATABASE_SSL_MODE:-require}
  ssl_root_cert: ${DATABASE_SSL_ROOT_CERT}

redis:
  url: ${REDIS_URL}
  key_prefix: ${REDIS_KEY_PREFIX:-lgsotf}
  max_connections: 128

llm:
  enabled: true
  provider: anthropic
  api_key: ${ANTHROPIC_API_KEY}
  fast:
    model: ${LLM_FAST_MODEL:-claude-haiku-4-5}
    max_tokens: 1024
    temperature: 0.0
    timeout_s: 60
    max_retries: 3
    max_concurrency: 32
  deep:
    model: ${LLM_DEEP_MODEL:-claude-opus-5-5}
    max_tokens: 16000
    timeout_s: 300
    max_retries: 3
    max_concurrency: 16
  prompt_caching: true
  max_input_chars: 24000
  max_field_chars: 2000
  max_list_items: 50
  daily_token_budget_per_tenant: ${LLM_DAILY_TOKEN_BUDGET_PER_TENANT:-5000000}

auth:
  jwt_secret: ${JWT_SECRET}
  jwt_issuer: lg-sotf
  jwt_audience: lg-sotf-api
  access_token_ttl_s: 900
  refresh_token_ttl_s: 1209600
  cookie_secure: true
  cookie_domain: ${COOKIE_DOMAIN}
  password_min_length: 12
  max_login_attempts: 10
  lockout_minutes: 15
  oidc_issuer: ${OIDC_ISSUER}
  oidc_audience: ${OIDC_AUDIENCE}
  oidc_jwks_url: ${OIDC_JWKS_URL}
  oidc_default_tenant: ${OIDC_DEFAULT_TENANT}
  bootstrap_admin_email: ${BOOTSTRAP_ADMIN_EMAIL}
  bootstrap_admin_password: ${BOOTSTRAP_ADMIN_PASSWORD}

api:
  host: 0.0.0.0
  port: 8000
  public_url: ${PUBLIC_URL}
  # The SPA is served same-origin; list extra origins with
  # LG_SOTF_API__CORS_ORIGINS='["https://soc.example.com"]'.
  cors_origins: []
  metrics_token: ${METRICS_TOKEN}
  docs_enabled: false
  forwarded_allow_ips: ${FORWARDED_ALLOW_IPS:-127.0.0.1}

worker:
  concurrency: ${WORKER_CONCURRENCY:-16}
  per_tenant_concurrency: 8

security:
  encryption_keys: ${ENCRYPTION_KEYS}
  indicator_hmac_key: ${INDICATOR_HMAC_KEY}

observability:
  log_level: ${LOG_LEVEL:-INFO}
  log_format: json
  metrics_enabled: true
  otlp_endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
  service_name: lg-sotf

response:
  dry_run: ${RESPONSE_DRY_RUN:-true}
  webhook_url: ${RESPONSE_WEBHOOK_URL}
  webhook_secret: ${RESPONSE_WEBHOOK_SECRET}

agents:
  ingestion:
    batch_size: 100
    polling_interval: 60
    max_concurrent_alerts: 50
    enable_deduplication: true
    deduplication_window_hours: 24
    rate_limit_enabled: true
    max_alerts_per_minute: 5000
    max_alerts_per_source_minute: 1000
  triage:
    confidence_threshold: 80
    enable_ml_scoring: false
    enable_llm_scoring: true
    llm_weight: 0.4
  correlation:
    correlation_window_minutes: 60
    similarity_threshold: 0.7
    max_correlations: 10
    enable_llm_correlation: true
    llm_weight: 0.3
    enable_threat_intel: true
    enable_siem_queries: true
    enable_burst_detection: true
    burst_threshold_per_minute: 5
  analysis:
    max_iterations: 5
    min_confidence_threshold: 60
    max_confidence_threshold: 90
    enable_tool_orchestration: true
    enable_llm_reasoning: true
    parallel_tool_execution: true
    max_parallel_tools: 3
    tool_timeout: 30
    enable_fallback_analysis: true
  human_loop:
    escalation_threshold: 60
    max_escalation_level: 3
    response_timeout_hours: 8
    auto_escalate_enabled: true
    sla_check_interval: 300
  response:
    enabled: true
    dry_run_mode: true
    auto_approve_low_risk: false
    auto_approve_medium_risk: false
    auto_approve_high_risk: false
    max_parallel_actions: 3
    action_timeout: 60

routing:
  max_alert_age_hours: 72
  correlation_grey_zone_min: 30
  correlation_grey_zone_max: 70
  analysis_threshold: 40
  human_review_min: 20
  human_review_max: 60
  response_threshold: 80

tools:
  execution_timeout: 30
  caching_enabled: true
  cache_ttl: 1800
  max_retries: 3
  backoff_factor: 2
  # Read by EnrichmentService as tools.<provider>. Provide the key from a secret store as
  # LG_SOTF_TOOLS__VIRUSTOTAL__API_KEY (never in a ConfigMap or this file).
  virustotal:
    api_key: ${VIRUSTOTAL_API_KEY}
    timeout: 15
    rate_limit: 4

ingestion:
  llm_normalization: false
