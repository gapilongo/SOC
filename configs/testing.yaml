# LG-SOTF test-suite configuration: offline, deterministic, fake LLM.
# Its secrets are published placeholders (see lg_sotf.security.insecure) and are
# refused in staging/production.
#
# Integration tests take their database and Redis from
# LG_SOTF_TEST_DATABASE_URL / LG_SOTF_TEST_REDIS_URL; the URLs below are only
# used when a test builds Settings from this file directly.

environment: test

database:
  url: ${LG_SOTF_TEST_DATABASE_URL:-postgresql://soc:soc_dev_password@localhost:5432/soc_test}
  pool_min: 1
  pool_max: 4
  command_timeout_s: 10

redis:
  url: ${LG_SOTF_TEST_REDIS_URL:-redis://localhost:6379/1}
  key_prefix: lgsotf-test
  max_connections: 8

llm:
  enabled: true
  provider: fake
  allow_fake: true
  fast:
    model: fake-fast
    max_tokens: 1024
    max_concurrency: 4
  deep:
    model: fake-deep
    max_tokens: 4096
    max_concurrency: 2
  prompt_caching: false
  max_input_chars: 8000
  max_field_chars: 500
  max_list_items: 20
  daily_token_budget_per_tenant: 100000

auth:
  jwt_secret: lg-sotf-test-suite-only-jwt-secret-not-for-use
  cookie_secure: false
  password_min_length: 12
  max_login_attempts: 5
  lockout_minutes: 1

api:
  cors_origins:
    - http://testserver
  rate_limit_per_minute: 10000
  ingest_rate_limit_per_minute: 10000
  login_rate_limit_per_minute: 1000

worker:
  concurrency: 2
  node_timeout_s: 30
  analysis_timeout_s: 60
  run_timeout_s: 120
  max_deliveries: 3
  visibility_timeout_s: 30
  block_ms: 100
  drain_timeout_s: 5

scheduler:
  tick_s: 0.5
  leader_lease_s: 5

security:
  encryption_keys: bGctc290Zi10ZXN0LXN1aXRlLW9ubHkta2V5LTAwMDA=
  indicator_hmac_key: lg-sotf-test-suite-only-indicator-hmac-key

observability:
  log_level: WARNING
  log_format: json
  metrics_enabled: true

response:
  dry_run: true
  max_actions_per_hour_per_tenant: 1000

agents:
  triage:
    enable_llm_scoring: true
  correlation:
    correlation_window_minutes: 60
    enable_llm_correlation: true
  analysis:
    max_iterations: 2
  # human_loop takes the install defaults of the tenant review policy (sla_minutes,
  # level_thresholds, min_level, grouping, suggest_suppressions); see
  # lg_sotf.services.escalation. Response actions are governed by the top-level
  # ``response`` section (response.dry_run), not by an agents.response block.

routing:
  max_alert_age_hours: 72
  correlation_grey_zone_min: 30
  correlation_grey_zone_max: 70
  analysis_threshold: 40
  human_review_min: 20
  human_review_max: 60
  response_threshold: 80

ingestion:
  llm_fallback: false
