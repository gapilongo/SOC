# LG-SOTF development configuration.
#
# Load with LG_SOTF_CONFIG_FILE=configs/development.yaml. This file is the
# lowest-precedence layer: LG_SOTF_<SECTION>__<KEY> environment variables and
# .env override it. ${VAR} / ${VAR:-default} are expanded from the environment.
#
# The jwt_secret, encryption_keys and indicator_hmac_key below are published
# placeholders so a checkout runs without setup. They are listed in
# lg_sotf.security.insecure, and staging/production refuse them: SecretBox and
# hmac_indicator raise, and ConfigManager.validate() fails. Never copy them into
# another environment; generate real values (see .env.example).

environment: development

database:
  url: postgresql://soc:soc_dev_password@localhost:5432/soc
  pool_min: 2
  pool_max: 10

redis:
  url: redis://localhost:6379/0
  key_prefix: lgsotf

llm:
  enabled: true
  provider: anthropic   # LG_SOTF_LLM__PROVIDER=fake runs fully offline
  # api_key: taken from ANTHROPIC_API_KEY (or LG_SOTF_LLM__API_KEY)
  fast:
    model: claude-haiku-4-5
    max_tokens: 1024
    temperature: 0.0
    timeout_s: 60
    max_retries: 2
    max_concurrency: 8
  deep:
    # Thinking is always on for this model and sampling parameters are not
    # accepted, so temperature is omitted automatically.
    model: claude-opus-5-5
    max_tokens: 16000
    timeout_s: 300
    max_retries: 2
    max_concurrency: 4
  prompt_caching: true
  max_input_chars: 24000
  max_field_chars: 2000
  max_list_items: 50
  daily_token_budget_per_tenant: 2000000

auth:
  jwt_secret: lg-sotf-development-only-jwt-secret-do-not-use
  cookie_secure: false
  access_token_ttl_s: 3600
  bootstrap_tenant_id: default
  bootstrap_tenant_name: Default
  # Bootstrap admin: LG_SOTF_AUTH__BOOTSTRAP_ADMIN_EMAIL / LG_SOTF_AUTH__BOOTSTRAP_ADMIN_PASSWORD

api:
  host: 127.0.0.1
  port: 8000
  public_url: http://localhost:8000
  cors_origins:
    - http://localhost:3000
    - http://localhost:5173
  docs_enabled: true

worker:
  concurrency: 4
  per_tenant_concurrency: 4

security:
  encryption_keys: bGctc290Zi1kZXZlbG9wbWVudC1vbmx5LWtleS0wMDA=
  indicator_hmac_key: lg-sotf-development-only-indicator-hmac-key

observability:
  log_level: INFO
  log_format: console
  metrics_enabled: true

response:
  dry_run: true

# ---------------------------------------------------------------------------
# Free-form tuning read by agents via ConfigManager.get("agents.<name>.<key>")
# ---------------------------------------------------------------------------
agents:
  triage:
    enable_llm_scoring: true
    llm_weight: 0.4
  correlation:
    correlation_window_minutes: 60
    burst_window_minutes: 15
    burst_threshold: 5
    max_correlations: 10
    enable_llm_correlation: true
    llm_weight: 0.3
  analysis:
    max_iterations: 5
    enable_llm_reasoning: true
  # human_loop takes the install defaults of the tenant review policy (sla_minutes,
  # level_thresholds, min_level, grouping, suggest_suppressions); see
  # lg_sotf.services.escalation. Response actions are governed by the top-level
  # ``response`` section (response.dry_run), not by an agents.response block.

routing:
  max_alert_age_hours: 72
  correlation_grey_zone_min: 30
  correlation_grey_zone_max: 70
  analysis_threshold: 40
  human_review_min: 20
  human_review_max: 60
  response_threshold: 80

tools:
  virustotal:
    api_key: ${VIRUSTOTAL_API_KEY:-}
    timeout_s: 10
    requests_per_minute: 4

ingestion:
  llm_fallback: false
