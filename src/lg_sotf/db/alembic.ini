# Operator entry point: alembic -c src/lg_sotf/db/alembic.ini upgrade head
# The database URL is taken from LG-SOTF settings (LG_SOTF_DATABASE__URL or
# DATABASE_URL) unless sqlalchemy.url is set here. `lg-sotf migrate` does not
# need this file.
[alembic]
script_location = %(here)s/migrations
path_separator = os
sqlalchemy.url =
