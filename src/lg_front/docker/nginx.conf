# nginx configuration for the LG-SOTF web app (non-root, read-only root fs).
#
# Everything nginx writes lives under /tmp. The entrypoint generates, from
# the environment:
#   /tmp/lg-sotf/config.js         runtime configuration served at /config.js
#   /tmp/lg-sotf/headers.conf      security headers incl. the Content-Security-Policy
#   /tmp/lg-sotf/api-proxy.conf    optional reverse proxy of /api to the API

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  log_format main escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
                              '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,'
                              '"user_agent":"$http_user_agent"}';
  # $uri, not $request_uri: query strings (OIDC codes) are never logged.
  access_log /dev/stdout main;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 1m;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080;
    # IPv6 listener when the kernel supports it (generated by the entrypoint).
    include /tmp/lg-sotf/listen-ipv6.conf;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    charset utf-8;

    # Liveness/readiness: no file access, no logging noise.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Runtime configuration: generated at start-up, never cached.
    location = /config.js {
      alias /tmp/lg-sotf/config.js;
      default_type application/javascript;
      include /tmp/lg-sotf/headers.conf;
      add_header Cache-Control "no-store" always;
    }

    # Content-hashed build output: cache forever. Unknown files are 404, not the SPA.
    location /assets/ {
      include /tmp/lg-sotf/headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location = /favicon.svg {
      include /tmp/lg-sotf/headers.conf;
      add_header Cache-Control "public, max-age=86400" always;
    }

    # Optional same-origin API proxy (LG_SOTF_API_UPSTREAM).
    include /tmp/lg-sotf/api-proxy.conf;

    # SPA: every other path serves index.html, revalidated on each load so a
    # new release is picked up immediately.
    location / {
      include /tmp/lg-sotf/headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri /index.html;
    }
  }
}
