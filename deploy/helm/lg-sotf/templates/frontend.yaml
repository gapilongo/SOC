{{- if .Values.frontend.enabled }}
{{- $c := dict "root" . "component" "frontend" "values" .Values.frontend }}
{{- $name := include "lg-sotf.componentName" $c }}
# Static web UI (image from src/lg_front/Dockerfile). It talks to the API
# through the same Ingress host by default, so it needs no secrets; the
# public runtime settings below become /config.js and the
# Content-Security-Policy when the container starts.
{{- $cfg := .Values.frontend.config }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "lg-sotf.componentLabels" $c | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "lg-sotf.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lg-sotf.podLabels" $c | nindent 8 }}
      {{- with .Values.frontend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "lg-sotf.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "lg-sotf.scheduling" $c | trim | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "lg-sotf.frontendImage" . }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.containerPort }}
              protocol: TCP
          env:
            - name: LG_SOTF_API_BASE_URL
              value: {{ $cfg.apiBaseUrl | quote }}
            - name: LG_SOTF_WS_URL
              value: {{ $cfg.wsUrl | quote }}
            - name: LG_SOTF_CSP_CONNECT_SRC
              value: {{ join " " $cfg.extraConnectSrc | quote }}
            - name: LG_SOTF_HSTS_MAX_AGE
              value: {{ $cfg.hstsMaxAge | toString | quote }}
            - name: LG_SOTF_OIDC_ISSUER
              value: {{ $cfg.oidc.issuer | quote }}
            - name: LG_SOTF_OIDC_CLIENT_ID
              value: {{ $cfg.oidc.clientId | quote }}
            - name: LG_SOTF_OIDC_SCOPE
              value: {{ $cfg.oidc.scope | quote }}
            - name: LG_SOTF_OIDC_AUDIENCE
              value: {{ $cfg.oidc.audience | quote }}
            - name: LG_SOTF_OIDC_TOKEN_TYPE
              value: {{ $cfg.oidc.tokenType | quote }}
            - name: LG_SOTF_OIDC_REDIRECT_URI
              value: {{ $cfg.oidc.redirectUri | quote }}
            - name: LG_SOTF_OIDC_AUTHORIZATION_ENDPOINT
              value: {{ $cfg.oidc.authorizationEndpoint | default "" | quote }}
            - name: LG_SOTF_OIDC_TOKEN_ENDPOINT
              value: {{ $cfg.oidc.tokenEndpoint | quote }}
            - name: LG_SOTF_OIDC_END_SESSION_ENDPOINT
              value: {{ $cfg.oidc.endSessionEndpoint | default "" | quote }}
            - name: LG_SOTF_OIDC_LABEL
              value: {{ $cfg.oidc.label | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "lg-sotf.componentLabels" $c | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "lg-sotf.selectorLabels" $c | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.frontend.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "lg-sotf.componentLabels" $c | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.frontend.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "lg-sotf.selectorLabels" $c | nindent 6 }}
{{- end }}
{{- end }}
