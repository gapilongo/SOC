{{- if .Values.api.enabled }}
{{- $c := dict "root" . "component" "api" "values" .Values.api }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lg-sotf.componentName" $c }}
  labels:
    {{- include "lg-sotf.componentLabels" $c | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      {{- include "lg-sotf.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lg-sotf.podLabels" $c | nindent 8 }}
      annotations:
        {{- include "lg-sotf.podAnnotations" $c | nindent 8 }}
    spec:
      serviceAccountName: {{ include "lg-sotf.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- include "lg-sotf.scheduling" $c | trim | nindent 6 }}
      containers:
        - name: api
          image: {{ include "lg-sotf.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["api", "--port", "{{ .Values.api.containerPort }}"]
          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}
              protocol: TCP
          env:
            {{- include "lg-sotf.env" . | nindent 12 }}
          envFrom:
            {{- include "lg-sotf.envFrom" (dict "root" . "owner" false "bootstrap" false) | nindent 12 }}
          {{- with .Values.api.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.api.preStopSleepSeconds }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.api.preStopSleepSeconds }}"]
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- include "lg-sotf.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "lg-sotf.volumes" (dict "root" . "configMap" (include "lg-sotf.configMapName" .)) | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lg-sotf.componentName" $c }}
  labels:
    {{- include "lg-sotf.componentLabels" $c | nindent 4 }}
  {{- with (merge (deepCopy .Values.api.service.annotations) .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "lg-sotf.selectorLabels" $c | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "lg-sotf.componentName" $c }}
  labels:
    {{- include "lg-sotf.componentLabels" $c | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "lg-sotf.componentName" $c }}
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
    {{- if .Values.api.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
{{- end }}
{{- if .Values.api.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "lg-sotf.componentName" $c }}
  labels:
    {{- include "lg-sotf.componentLabels" $c | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.api.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "lg-sotf.selectorLabels" $c | nindent 6 }}
{{- end }}
{{- end }}
