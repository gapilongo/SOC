{{- if and .Values.ingress.enabled .Values.api.enabled }}
{{- $api := include "lg-sotf.componentName" (dict "root" . "component" "api") }}
{{- $frontend := include "lg-sotf.componentName" (dict "root" . "component" "frontend") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lg-sotf.fullname" . }}
  labels:
    {{- include "lg-sotf.labels" . | nindent 4 }}
  {{- with (merge (deepCopy .Values.ingress.annotations) .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- range . }}
    - secretName: {{ .secretName }}
      hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $api }}
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ if $.Values.frontend.enabled }}{{ $frontend }}{{ else }}{{ $api }}{{ end }}
                port:
                  name: http
    {{- end }}
{{- end }}
