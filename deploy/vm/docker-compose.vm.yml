# VM overlay: the production-like stack on a single host (docs/cicd.md), shared
# by both ingress modes of deploy/vm/deploy.sh:
#
#   docker compose -p lgsotf-<env> \
#     -f docker/docker-compose.yml -f docker/docker-compose.prod.yml \
#     -f deploy/vm/docker-compose.vm.yml -f deploy/vm/docker-compose.<ingress>.yml \
#     --env-file <env dir>/.env up -d --wait
#
# where <ingress> is `caddy` (deploy.sh --ingress caddy, the default) or
# `funnel` (--ingress funnel).
#
# deploy/vm/deploy.sh writes that .env and runs these commands; you do not need
# to by hand. On top of docker-compose.prod.yml (two database roles, staging
# safety checks, secrets only through ${...} interpolation) this overlay:
#
# * runs published images (APP_IMAGE / FRONTEND_IMAGE, pinned by digest) and
#   never builds;
# * always runs the frontend (no profile);
# * publishes no host ports: the ingress overlay decides how traffic arrives
#   (docker-compose.caddy.yml: the shared Caddy of docker-compose.edge.yml over
#   the external `lgsotf-proxy` network; docker-compose.funnel.yml: a
#   Tailscale Funnel sidecar);
# * trusts X-Forwarded-For/-Proto only from the addresses deploy.sh computes
#   for the ingress (LG_SOTF_API__FORWARDED_ALLOW_IPS);
# * sets memory/CPU limits sized so two environments fit on an Always Free
#   Ampere VM (4 OCPU / 24 GB), restart policies and log rotation.
#
# Limits can be raised per environment with the *_MEM / *_CPUS variables.

x-vm-logging: &vm-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    # A stable path outside the release directory, so a new release does not
    # recreate the database container (deploy.sh copies the script there).
    volumes:
      - ${LGSOTF_ENV_DIR:?set LGSOTF_ENV_DIR}/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    shm_size: 256m
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPUS:-1.0}"
          memory: ${POSTGRES_MEM:-1536m}
    logging: *vm-logging
    restart: unless-stopped

  redis:
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPUS:-0.5}"
          memory: ${REDIS_MEM:-512m}
    logging: *vm-logging
    restart: unless-stopped

  migrate:
    image: ${APP_IMAGE:?set APP_IMAGE}
    build: !reset null
    pull_policy: missing
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging: *vm-logging

  api:
    image: ${APP_IMAGE:?set APP_IMAGE}
    pull_policy: missing
    ports: !reset []
    environment:
      LG_SOTF_API__FORWARDED_ALLOW_IPS: ${LG_SOTF_API__FORWARDED_ALLOW_IPS:?set LG_SOTF_API__FORWARDED_ALLOW_IPS}
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-1.0}"
          memory: ${API_MEM:-1g}
    logging: *vm-logging
    restart: unless-stopped

  worker:
    image: ${APP_IMAGE:?set APP_IMAGE}
    pull_policy: missing
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-1.5}"
          memory: ${WORKER_MEM:-2g}
    logging: *vm-logging
    restart: unless-stopped

  scheduler:
    image: ${APP_IMAGE:?set APP_IMAGE}
    pull_policy: missing
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "${SCHEDULER_CPUS:-0.5}"
          memory: ${SCHEDULER_MEM:-512m}
    logging: *vm-logging
    restart: unless-stopped

  frontend:
    profiles: !reset []
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE}
    build: !reset null
    pull_policy: missing
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPUS:-0.5}"
          memory: ${FRONTEND_MEM:-128m}
    logging: *vm-logging
    restart: unless-stopped
