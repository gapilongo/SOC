[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lg-sotf"
dynamic = ["version"]
description = "Multi-tenant AI triage and investigation platform for security alerts, built on LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LG-SOTF Team", email = "team@lg-sotf.org" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    # Workflow engine and durable checkpoints
    "langgraph>=1.2,<2",
    "langgraph-checkpoint>=4.1.1,<5",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "psycopg[binary,pool]>=3.2,<4",
    # LLM
    "langchain-core>=1.6,<2",
    "langchain-anthropic>=1.7,<2",
    # Storage and queue
    "asyncpg>=0.30,<1",
    "redis>=5.2,<9",
    "alembic>=1.13,<2",
    "sqlalchemy>=2.0,<3",
    # API
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    # Configuration and models
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "annotated-types>=0.6",
    "pyyaml>=6.0,<7",
    "click>=8.1,<9",
    # Security
    "pyjwt[crypto]>=2.8,<3",
    "argon2-cffi>=23.1,<26",
    "cryptography>=42",
    # Observability
    "prometheus-client>=0.20,<1",
    "structlog>=24.1",
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.25,<2",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0,<2"]
gemini = ["langchain-google-genai>=4.0,<5"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "fakeredis>=2.26",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-PyYAML",
    "import-linter>=2.15",
    "pre-commit>=4.0",
    "pytest-timeout>=2.3",
]

[project.urls]
Homepage = "https://github.com/gapilongo/SOC"
Repository = "https://github.com/gapilongo/SOC"
Issues = "https://github.com/gapilongo/SOC/issues"

[project.scripts]
lg-sotf = "lg_sotf.cli:main"

[tool.setuptools.dynamic]
version = { attr = "lg_sotf.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["lg_sotf*"]

[tool.setuptools.package-data]
lg_sotf = [
    "py.typed",
    "db/alembic.ini",
    "db/migrations/script.py.mako",
    "db/migrations/versions/*.py",
]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]
# A hung async test fails after 2 minutes instead of burning the CI job (the process-level e2e and
# eval suites mark themselves timeout(300)).
timeout = 120
timeout_method = "signal"
# A coroutine that was never awaited, an unclosed socket, file or event loop, and an exception
# swallowed by a finalizer are bugs, not noise. The unit tier turns every warning into an error
# (tests/unit/conftest.py).
filterwarnings = [
    "error::RuntimeWarning",
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "integration: needs real PostgreSQL/Redis (LG_SOTF_TEST_DATABASE_URL / LG_SOTF_TEST_REDIS_URL); skipped when unset",
    "slow: long-running tests (deselect with -m 'not slow')",
    "unit: fast, isolated tests",
]

[tool.coverage.run]
source = ["lg_sotf"]
branch = true
# Alembic runs the migrations in a subprocess coverage does not see; tests/integration/db/test_migrations.py
# exercises every revision (upgrade, downgrade, re-upgrade).
omit = ["*/lg_sotf/db/migrations/*"]

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "BLE", "A", "RUF100", "TID251", "T20", "DTZ", "C90"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP045", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S603", "UP042", "TID251", "T20", "DTZ"]
"scripts/**" = ["TID251", "T20", "DTZ"]
"docker/**" = ["TID251", "T20", "DTZ"]
"examples/**" = ["TID251", "T20", "DTZ"]
# The only reader of the environment (ADR-0013, CONTRIBUTING); CLIs print by design.
"src/lg_sotf/settings.py" = ["TID251"]
"src/lg_sotf/cli.py" = ["T20"]
"src/lg_sotf/eval/command.py" = ["T20"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "read configuration through lg_sotf.settings"
"os.getenv".msg = "read configuration through lg_sotf.settings"
"os.putenv".msg = "read configuration through lg_sotf.settings"

# Ratchet: today's offenders carry a per-function noqa (RUF100 fails a stale one); the target is 15.
[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.isort]
known-first-party = ["lg_sotf"]

[tool.mypy]
python_version = "3.11"
# Bare `mypy` (make typecheck, CI) checks every product file and the SOAR examples.
files = ["src/lg_sotf", "examples/soar/receiver", "examples/soar/n8n/build_workflow.py"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "lg_sotf.settings",
    "lg_sotf.llm.*",
    "lg_sotf.security.*",
    "lg_sotf.observability.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

# Architecture contracts (docs/design/refactor-roadmap.md section 1.1, docs/adr/0001-layering.md).
# `make import-lint` / CI. ignore_imports pins today's exceptions as exact pairs; each roadmap
# step deletes the lines it makes unnecessary, and an ignore that no longer matches fails.
[tool.importlinter]
root_package = "lg_sotf"
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Layers: imports point down only"
type = "layers"
containers = ["lg_sotf"]
layers = [
    "__main__",
    "cli",
    "api | mcp | eval",
    "runtime",
    "core",
    "services | compliance | onboarding | agents | ingestion",
    "integrations | tools | llm | queue",
    "audit",
    "db",
    "(domain)",
    "models",
    "(net)",
    "(errors) : observability : security : settings",
]
ignore_imports = [
    # C1 urls, phishing and routing to lg_sotf.domain
    "lg_sotf.agents.analysis.base -> lg_sotf.core.phishing",
    "lg_sotf.agents.analysis.base -> lg_sotf.core.routing",
    "lg_sotf.agents.correlation.base -> lg_sotf.core.phishing",
    "lg_sotf.agents.correlation.base -> lg_sotf.core.routing",
    "lg_sotf.agents.triage.base -> lg_sotf.core.phishing",
    "lg_sotf.agents.triage.base -> lg_sotf.core.routing",
    "lg_sotf.services.escalation -> lg_sotf.core.routing",
    "lg_sotf.services.reporting -> lg_sotf.core.routing",
    "lg_sotf.services.response -> lg_sotf.core.phishing",
    "lg_sotf.services.review -> lg_sotf.core.routing",
    # C2 suppression and events to domain
    "lg_sotf.integrations.delivery -> lg_sotf.core.events",
    "lg_sotf.services.dispatch -> lg_sotf.core.events",
    "lg_sotf.services.escalation -> lg_sotf.core.events",
    "lg_sotf.services.response -> lg_sotf.core.events",
    "lg_sotf.services.review -> lg_sotf.core.events",
    "lg_sotf.services.review -> lg_sotf.core.suppression",
    # C3 indicators to domain
    "lg_sotf.services.response -> lg_sotf.agents.correlation.indicators",
    # C4 checkpointer to db
    "lg_sotf.db.migrate -> lg_sotf.core.checkpointer",
    # C5 connector port to domain/connectors.py
    "lg_sotf.integrations.channels -> lg_sotf.services.connectors.webhook",
    "lg_sotf.integrations.microsoft.capability -> lg_sotf.services.connectors.base",
    "lg_sotf.integrations.microsoft.defender._common -> lg_sotf.services.connectors.base",
    "lg_sotf.integrations.microsoft.defender.forensics -> lg_sotf.services.connectors.base",
    "lg_sotf.integrations.microsoft.defender.indicators -> lg_sotf.services.connectors.base",
    "lg_sotf.integrations.microsoft.defender.isolation -> lg_sotf.services.connectors.base",
    "lg_sotf.integrations.microsoft.defender.machine_actions -> lg_sotf.services.connectors.base",
    "lg_sotf.integrations.microsoft.defender.stop_quarantine -> lg_sotf.services.connectors.base",
    "lg_sotf.integrations.microsoft.entra.account -> lg_sotf.services.connectors.base",
    "lg_sotf.integrations.microsoft.entra.password -> lg_sotf.services.connectors.base",
    "lg_sotf.integrations.microsoft.entra.risk -> lg_sotf.services.connectors.base",
    "lg_sotf.integrations.microsoft.entra.sessions -> lg_sotf.services.connectors.base",
    "lg_sotf.integrations.microsoft.entra.users -> lg_sotf.services.connectors.base",
    "lg_sotf.integrations.microsoft.mail.mailboxes -> lg_sotf.services.connectors.base",
    "lg_sotf.integrations.microsoft.mail.notify -> lg_sotf.services.connectors.base",
    "lg_sotf.integrations.microsoft.mail.remediate -> lg_sotf.services.connectors.base",
    "lg_sotf.integrations.ticketing -> lg_sotf.services.connectors.base",
    # C6 action catalog to domain/actions.py
    "lg_sotf.integrations.microsoft.catalog -> lg_sotf.services.response",
    # F1 kernel error module
    "lg_sotf.agents.correlation.base -> lg_sotf.core.exceptions",
    "lg_sotf.db.errors -> lg_sotf.core.exceptions",
    # F3 extract lg_sotf.net (egress, TLS, Retry-After)
    "lg_sotf.integrations.http -> lg_sotf.ingestion.errors",
    "lg_sotf.integrations.http -> lg_sotf.ingestion.options",
    "lg_sotf.integrations.http -> lg_sotf.ingestion.sources.http",
    "lg_sotf.integrations.http -> lg_sotf.ingestion.sources.netpolicy",
    "lg_sotf.integrations.microsoft.auth -> lg_sotf.ingestion.errors",
    "lg_sotf.integrations.microsoft.auth -> lg_sotf.ingestion.sources.http",
    "lg_sotf.integrations.microsoft.http -> lg_sotf.ingestion.errors",
    "lg_sotf.integrations.microsoft.http -> lg_sotf.ingestion.sources.http",
    "lg_sotf.integrations.microsoft.http -> lg_sotf.ingestion.sources.netpolicy",
    "lg_sotf.llm.endpoint -> lg_sotf.ingestion.sources.netpolicy",
    "lg_sotf.services.connectors.microsoft -> lg_sotf.ingestion.sources.netpolicy",
    "lg_sotf.services.connectors.registry -> lg_sotf.ingestion.errors",
    "lg_sotf.services.connectors.registry -> lg_sotf.ingestion.options",
    "lg_sotf.services.connectors.registry -> lg_sotf.ingestion.sources.http",
    "lg_sotf.services.connectors.registry -> lg_sotf.ingestion.sources.netpolicy",
    "lg_sotf.services.connectors.webhook -> lg_sotf.ingestion.errors",
    "lg_sotf.services.connectors.webhook -> lg_sotf.ingestion.sources.http",
    "lg_sotf.services.connectors.webhook -> lg_sotf.ingestion.sources.netpolicy",
    "lg_sotf.tools.enrichment.http -> lg_sotf.ingestion.sources.http",
    # F7 one owner-DSN helper / D2 atomic provisioning
    "lg_sotf.compliance.ops -> lg_sotf.runtime.ops",
    # ADR-0001 accepted: lazy import inside Settings.production_problems
    "lg_sotf.settings -> lg_sotf.llm.endpoint",
]

[[tool.importlinter.contracts]]
id = "api-no-workflow"
name = "The API never runs a workflow"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["lg_sotf.api"]
forbidden_modules = ["lg_sotf.core.workflow", "lg_sotf.core.nodes", "lg_sotf.core.graph", "lg_sotf.agents", "langgraph"]

[[tool.importlinter.contracts]]
id = "mcp-thin-client"
name = "MCP is a thin REST client of the API"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["lg_sotf.mcp"]
forbidden_modules = [
    "lg_sotf.db", "lg_sotf.queue", "lg_sotf.services", "lg_sotf.core", "lg_sotf.agents", "lg_sotf.llm",
    "lg_sotf.integrations", "lg_sotf.api", "asyncpg", "redis",
]

[[tool.importlinter.contracts]]
id = "infra-drivers"
name = "Only db, core and runtime use database and workflow drivers"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "lg_sotf.services", "lg_sotf.compliance", "lg_sotf.onboarding", "lg_sotf.agents", "lg_sotf.ingestion",
    "lg_sotf.integrations", "lg_sotf.tools", "lg_sotf.llm", "lg_sotf.queue", "lg_sotf.audit", "lg_sotf.models",
]
forbidden_modules = ["asyncpg", "psycopg", "psycopg_pool", "langgraph"]
ignore_imports = [
    # F9 typed DB connection (driver types stay behind lg_sotf.db)
    "lg_sotf.compliance.tenant_data -> asyncpg",
    "lg_sotf.onboarding.service -> asyncpg",
]

[[tool.importlinter.contracts]]
id = "routers-independent"
name = "API routers do not import each other (shared code lives in api/deps.py or api/common.py)"
type = "independence"
modules = [
    "lg_sotf.api.routers.alerts",
    "lg_sotf.api.routers.audit",
    "lg_sotf.api.routers.auth",
    "lg_sotf.api.routers.compliance",
    "lg_sotf.api.routers.dashboard",
    "lg_sotf.api.routers.health",
    "lg_sotf.api.routers.identity",
    "lg_sotf.api.routers.ingest",
    "lg_sotf.api.routers.integrations",
    "lg_sotf.api.routers.mfa",
    "lg_sotf.api.routers.onboarding",
    "lg_sotf.api.routers.platform",
    "lg_sotf.api.routers.reports",
    "lg_sotf.api.routers.review",
    "lg_sotf.api.routers.sources",
    "lg_sotf.api.routers.suppressions",
    "lg_sotf.api.routers.tenant",
    "lg_sotf.api.routers.ws",
]
ignore_imports = [
    # S9 thin routers: move each shared helper to api/common.py
    "lg_sotf.api.routers.audit -> lg_sotf.api.routers.alerts",
    "lg_sotf.api.routers.integrations -> lg_sotf.api.routers.review",
    "lg_sotf.api.routers.mfa -> lg_sotf.api.routers.auth",
    "lg_sotf.api.routers.platform -> lg_sotf.api.routers.identity",
    "lg_sotf.api.routers.reports -> lg_sotf.api.routers.suppressions",
    "lg_sotf.api.routers.suppressions -> lg_sotf.api.routers.alerts",
]
